  root_cause: MainActivity、Shell、Auth和Identity分别以mutableState或局部枚举切页，Shell返回时重新以首页索引创建；实名认证和底部导航又用汉字或Unicode充当图标，页面没有统一前进/返回转场。既有门禁只核对业务和视觉参数，没有检查成熟导航基础设施。
  impact: 从“我的”进入实名认证后返回错误跳到首页；系统返回键或手势可能直接退出App；身份页面显示“相”“人”等字符；所有既有和后续页面都可能重复同类问题。
  resolution: CR-0119统一采用Stable Jetpack Navigation Compose 2.9.8、HhyIcons矢量语义注册、HhyMotion冻结转场和rememberSaveable来源状态恢复；迁移全部既有Android页面，并新增全量静态门禁与导航回归。
  regression_checks:
  - scripts/check_android_ui_foundation.py
  - tests/test_android_ui_foundation.py
  - Android MainActivity、Shell、Auth、Identity模块编译与测试
  - 真机验证“我的→实名认证→资料页→返回→实名认证→返回→我的”
  do_not_repeat:
  - 不得用文字、汉字、Unicode、Emoji或字体字符充当图标
  - 不得用mutableState、枚举或自维护列表替代官方导航返回栈
  - 不得写死返回首页、我的或模块首页，必须返回实际来源
  - 不得省略前进、返回与手势返回的统一Token化转场
  - 基础方案必须优先官方Stable和大型商业App成熟架构；小众或自研例外必须ADR与批准CR
- id: PROB-0051
  title: 认证入口同级切换误用层级动效且子页返回来源写死
  status: MITIGATED
  root_cause: AuthScreen仍以单个AuthRoute状态和统一HhyMotion.forwardContent切换PASSWORD、SMS、REGISTER与RESET；BackHandler和页内返回又固定选择PASSWORD。原静态门禁把AnimatedContent列为认证模块合格标记，没有验证真实NavHost、peer motion和pop反向转场。
  impact: PASSWORD与SMS同级切换错误表现为右到左页面进入；REGISTER与RESET返回仍然右到左且从SMS进入后错误回到PASSWORD，违反真实来源返回和大型App成熟导航规则。
  resolution: CR-0123将PASSWORD/SMS保留为同级登录模式并仅使用HhyMotion.peerContent无方向淡入淡出；REGISTER/RESET迁移为Navigation Compose真实子目的地，进入使用forward、pop使用backward并恢复原登录模式。静态门禁新增对Auth route mutableState和forwardContent的精确阻断。
  regression_checks:
  - scripts/check_android_ui_foundation.py
  - tests/test_android_ui_foundation.py
  - feature-auth Kotlin编译与app导航测试
  - 真机分别从PASSWORD和SMS进入REGISTER/RESET并使用页内、系统键和手势返回
  do_not_repeat:
  - 同级Tab切换不得使用带方向的层级页面转场
  - 下级页面返回不得重新navigate到默认页，必须pop真实来源
  - 静态门禁不得只检查存在AnimatedContent或BackHandler，必须检查NavHost、pop转场和禁用模式
- id: PROB-0052
  title: R05公网没有激活实名认证运行配置导致资料提交阶段返回500
  status: MITIGATED
  root_cause: api.orbexa.cc已切到R05后端，但共享Staging数据库provider_config_versions中provider_code=identity的记录为0；R05IdentityRuntimePolicy在创建平台认证会话时无法取得active_provider、max_daily_attempts和poll_timeout_seconds，因此在调用第三方活体供应商之前即返回COMMON-500-INTERNAL。
  impact: versionCode 10210真机的实名认证首页和资料输入页通过，但无法创建SESSION_CREATED，活体容器与结果页无法进入；这不是用户姓名、身份证输入或第三方AppCode请求失败。
  current_behavior: api.orbexa.cc的Staging候选已显式启用STAGING_SANDBOX，POST /api/v1/identity/sessions返回200并可继续取得HTTPS活体页；沙箱完成后服务端事务状态为VERIFIED，同一state重放返回422。production仍默认关闭且误开会拒绝启动，正式供应商路径未被替换。
  resolution: CR-0124实现默认关闭、仅staging可显式启用、production误开即拒绝启动的供应商沙箱；候选与公网均通过注册、协议、创建会话、活体页面、完成、结果查询及一次性state防重放黑盒，Nginx从28085可回滚切换至28086并保留旧容器与配置备份。
  next_owner: TASK-R05-007
  required_evidence:
  - 激活受控Staging identity配置前必须完成字段校验、连接测试与审批链，禁止直接篡改ACTIVE记录
  - 未配置真实AppCode时生产真实认证必须关闭；如需真机覆盖活体和结果页，使用与生产硬隔离的受控Staging供应商沙箱
  - 配置后重新执行注册、授权说明、创建会话、活体令牌和结果查询黑盒门禁
  - scripts/check_r05_staging_identity_sandbox.py --api-base-url https://api.orbexa.cc
  - artifacts/validation/r05-public-rollforward/evidence.json
  do_not_repeat:
  - 不得把协议接口200等同于实名认证运行配置已就绪
  - 不得把创建会话阶段的500误归因于第三方活体Key
  - 不得为通过测试直接在生产逻辑中伪造VERIFIED或绕过供应商、证据和审批链
  - 测试供应商不得由客户端本地改状态；必须服务端事务落库并严格限制staging环境
- id: PROB-0053
  title: 10211测试APK错误渠道导致启动版本检查404
  status: SOLVED
  root_cause: 10211固定工具链构建时人为覆盖HHY_APP_CHANNEL=owner-test，但公网app_versions只发布official与STAGING组合；平台状态接口返回200后，POST /public-api/v1/app/version-check对owner-test返回404，StartupGate按安全策略进入暂时无法连接。既有版本测试没有断言BuildConfig.APP_CHANNEL和APP_ENVIRONMENT，四方哈希只证明产物一致，未证明启动策略维度存在。
  resolution: CR-0127恢复测试APK固定official与STAGING，递增10212，并在VersionMetadataTest强制断言BuildConfig渠道和环境；构建前直接黑盒确认相同版本请求返回200，禁止复用10211。
  regression_checks:
  - apps/android/app/src/test/java/cc/orbexa/hhy/VersionMetadataTest.kt
  - POST /public-api/v1/app/version-check with official + STAGING + current versionCode returns HTTP 200
  - 10212覆盖安装后首次启动直接进入登录或已登录页面，不出现暂时无法连接
  do_not_repeat:
  - 不得为区分项目所有者测试包自行发明未在后台发布的APP_CHANNEL
  - APK正式API地址正确、接口健康和四方哈希一致不能替代版本检查请求维度验证
  - 每次Android构建必须在单测中锁定发布渠道和环境，并在交付前以相同请求体执行公网黑盒
- id: PROB-0054
  title: R05第三方活体整页被固定取景区裁切且实名状态不能恢复
  status: SOLVED
  root_cause: Android把供应商完整100vh活体H5嵌入冻结的240dp取景区，页面内部按钮和人脸区域因此被裁切；实名首页又静态假定未认证，中途退出或完成认证后没有服务端总览入口恢复活动会话和最终状态。WebView重组还会按当前URL差异重新加载初始地址，存在打断供应商内部导航的风险。
  impact: 用户只能滚动黑色框寻找被遮挡按钮，完成后仍可再次认证；中途退出重进可能收到状态冲突并卡死，无法按大型App成熟交互继续原流程。
  resolution: CR-0128新增GET /api/v1/identity/overview，由服务端收敛过期、活动、人工审核和已认证状态；Android实名首页按三状态路由，活动会话继续原流程，已认证禁止新建。SCR-ID-003固定区域只展示本地准备/授权/加载/处理/失败，供应商H5改为独立全屏WebView并用稳定tag避免内部跳转被重载；系统返回和页内返回继续共用Navigation Compose真实栈。
  regression_checks:
  - IdentityServiceTest与IdentityControllerTest总览、活动会话和过期收敛测试
  - IdentityPresentationTest商业错误与技术字段过滤
  - feature:identity:testDebugUnitTest与app:compileDebugKotlin
  - scripts/check_r05_staging_identity_sandbox.py --api-base-url https://api.orbexa.cc
  - 真机验证活体H5全屏无需滚动、完成后首页已认证、中途退出可继续
  do_not_repeat:
  - 不得把第三方完整H5当作本地240dp相机预览组件
  - 不得在WebView每次重组时以当前内部URL不同为由重载供应商初始URL
  - 不得静态假设实名入口永远未认证；必须读取服务端事实并恢复活动会话
  - 不得用通用409或422文案覆盖经过技术字段过滤的安全商业原因
- id: PROB-0055
  title: Android自动门禁首次迁移到GitHub Linux后因平台差异整链失败
  status: SOLVED
  root_cause: 仓库长期只在Windows工作区和固定Android服务器镜像验证，GitHub干净Linux克隆未显式关闭Git中文路径转义，四个Hook与Android Gradle Wrapper也未提交可执行位；供应商原始TXT又被通用文本换行规则过滤，Context Pack记录了Windows工作区CRLF字节。Android各模块同时依赖GitHub稳定SDK仓库没有的预览API 37，工具与契约任务还隐式依赖Runner自带Node；临时Worktree动态Hook在POSIX系统默认为0644，Android门禁自身文件又未纳入Android影响映射，导致连续性、全量测试和Android全链分层失败或被错误跳过。
  resolution: CR-0138至CR-0144把GitHub连续性、工具和Android工作流统一配置core.quotepath=false，Hook与Android Gradle Wrapper提交为100755，动态Worktree Hook在POSIX系统强制chmod 700；供应商原始证据按二进制逐字节冻结，全部Android模块compileSdk与构建平台收敛到正式稳定API 36。工具与契约任务显式安装Node 24并持久上传诊断日志；模拟器Runner只调用仓库内单一可执行Bash脚本，避免其逐行sh执行语义破坏目录、变量与续行；UIAutomator截图写入ADB shell稳定可写的/data/local/tmp专用测试目录，避免应用专属目录随connectedDebugAndroidTest卸载被清除，也避免Android 15共享存储写入限制；JUnit失败断言直接汇总为GitHub Annotation。Android门禁工作流、策略、脚本、测试及影响映射自身全部纳入Android触发范围，后续必须实际执行全链且在干净Linux克隆复现通过。
  regression_checks:
  - python -m unittest tests.test_android_ci_gate tests.test_r05_identity_vendor_contract
  - python -m unittest discover -s tests -p 'test_*.py'
  - python scripts/continuity_gate.py --mode ci --strict --base-ref HEAD^ --head-ref HEAD
  - python scripts/project-doctor.py --strict
  - GitHub Actions Android Quality Gate：build、emulator、candidate全部PASS
  do_not_repeat:
  - 不得采用GitHub标准runner无法安装的Android预览SDK作为正式商业项目编译基线
  - 不得只在Windows工作区验证中文路径、换行和文件模式相关门禁
  - 不得把用户提供的原始供应商证据当普通文本自动改写换行
  - 不得在Hook缺少Linux可执行位或Context Pack依赖工作区CRLF时宣称可跨电脑、跨AI接续
  - 不得依赖GitHub Runner隐式提供Node，也不得提交缺少Linux执行位的Gradle Wrapper
  - 自动门禁必须保存可下载的测试日志，禁止失败后仅凭模糊结论反复试错
  - 不得在逐行执行script输入的第三方Action中内嵌依赖共享状态的多行Shell，必须调用仓库内受测脚本
  - 不得只写入临时Git Hook内容而不在POSIX系统赋执行位；禁止依赖Windows忽略文件模式的行为
  - Android门禁自身文件发生变化时不得被影响分析跳过Android任务
