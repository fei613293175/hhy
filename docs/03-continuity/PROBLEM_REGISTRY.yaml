problems:
- id: PROB-0001
  title: AI效果图包含虚拟或错误功能
  status: SOLVED
  root_cause: 效果图生成模型会虚构按钮、金额、第三方登录、商豆、CRM和多会员身份
  resolution: 开发文档和Token优先；效果图只作布局样式参考；已在AGENTS和UI绑定中强制
  regression_checks:
  - scripts/check_main_doc.py
  - scripts/check_ui_tokens.py
  do_not_repeat:
  - 不得从效果图新增业务功能
- id: PROB-0002
  title: V1.1缺少完整工程契约和自动门禁
  status: SOLVED
  root_cause: 页面/API/表只有目录，配置和版本任务未完全机器化
  resolution: V1.2增加OpenAPI、Schema、314项配置、追踪矩阵、逐版本Manifest/Tasks和project-doctor
  regression_checks:
  - scripts/project-doctor.sh
  do_not_repeat:
  - 不得绕过契约和追踪直接编码
- id: PROB-0003
  title: Git初始化前领取P00导致会话基线无法创建检查点
  status: SOLVED
  root_cause: resume在无Git时错误提示先执行start，bootstrap创建Baseline Commit后又未把ACTIVE会话的NOT_INITIALIZED基线回填为真实Commit
  resolution: 无Git冷启动改为明确输出bootstrap命令；兼容已先领取P00的会话，在bootstrap完成后校验Actor和Task并原子回填Git基线、会话指针和Context Pack
  regression_checks:
  - tests/test_continuity_bootstrap_recovery.py
  do_not_repeat:
  - 不得让无Git的resume输出start作为下一条命令
  - 不得让ACTIVE会话在Baseline Commit创建后继续保留NOT_INITIALIZED基线
- id: PROB-0004
  title: P00派生资产、页面计数和前端锁文件与冻结基线分叉
  status: SOLVED
  root_cause: 后端运行时副本、生成器断言和客户端类型仍停留在V1.2.1/V1.2.2早期快照；锁文件又引用了npm不存在的source-map-js 1.2.2，旧生成器缺少富化联接和递归JSON类型后处理
  resolution: 新增只从权威契约和迁移同步运行时副本的哈希门禁；页面生成器改为74/13/102并联接冻结规格；锁文件回到source-map-js 1.2.1；OpenAPI类型生成增加确定性递归类型后处理
  regression_checks:
  - scripts/sync_runtime_assets.py --check
  - scripts/check_api_contract.py
  - scripts/check_db_schema.py
  - apps/admin-web/src/catalog.test.ts
  - pnpm typecheck && pnpm test && pnpm build
  do_not_repeat:
  - 不得直接运行会删除V009或丢失冻结元数据的旧全量生成路径
  - 后端运行时契约和迁移副本必须与根权威源逐字节一致
- id: PROB-0005
  title: Spring Boot 4 staging启动未触发Flyway自动迁移
  status: SOLVED
  root_cause: Boot 4将Flyway自动配置拆分到独立模块，后端仅声明flyway-core和数据库模块，导致应用健康但空库没有执行V001至V011
  resolution: 使用Spring Boot 4官方spring-boot-starter-flyway，保留PostgreSQL专用模块，并以真实staging空库启动和自动配置类回归测试双重门禁
  regression_checks:
  - services/backend/boot/src/test/java/cc/orbexa/hhy/P00FlywayAutoConfigurationTest.java
  - staging空库启动后必须有11条版本化Flyway记录，且排除flyway_schema_history后hhy业务基础表必须为198
  do_not_repeat:
  - 不得以应用HTTP健康替代数据库迁移完成验证
  - Spring Boot大版本升级后必须核对已拆分starter及自动配置模块
- id: PROB-0006
  title: 连续性隔离测试继承当前NEXT_TASK导致P00后期误失败
  status: SOLVED
  root_cause: 冷启动和全生命周期测试复制真实仓库后只清空Session活动状态，未把NEXT_TASK、P00任务状态和已完成任务恢复到测试所需的P00初始场景
  resolution: 两个隔离夹具显式恢复TASK-P00-001为READY、后续任务为BLOCKED、NEXT_TASK指向TASK-P00-001，并移除当前P00完成记录；真实仓库状态保持不变
  regression_checks:
  - tests/test_continuity_bootstrap_recovery.py
  - scripts/test_continuity_protocol.py
  - scripts/run_p00_test_matrix.py --check
  do_not_repeat:
  - 隔离生命周期测试不得隐式继承真实仓库当前任务指针
  - 固定从P00初始任务启动的测试必须同时重置NEXT_TASK、TASKS和CURRENT_STATUS
- id: PROB-0007
  title: R01加密幂等快照在Java 21真实门禁中无法序列化时间且重放路径误判
  status: SOLVED
  root_cause: access模块使用Jackson 2序列化含Instant的首次响应但未声明jsr310模块；认证过滤器又依赖MockMvc下为空的servletPath识别重放白名单；新增测试还错误Mock了final令牌服务
  resolution: access显式声明受管的jackson-datatype-jsr310；白名单改用去除contextPath后的requestURI精确匹配；快照测试使用真实令牌、TOTP和加密组件并保留Instant往返断言
  regression_checks:
  - services/backend/boot/src/test/java/cc/orbexa/hhy/access/admin/AdminSecurityIdempotencySnapshotServiceTest.java
  - services/backend/boot/src/test/java/cc/orbexa/hhy/access/admin/AdminSecurityWebSecurityTest.java
  - Maven 21全模块测试必须通过且真实PostgreSQL重放验证不得跳过
  do_not_repeat:
  - 不得以findAndRegisterModules替代对Java时间模块的显式运行时依赖
  - 安全路径白名单不得依赖容器或测试环境可能为空的servletPath
  - 安全组件测试不得用无法实例化的final Mock掩盖真实序列化和加密路径
- id: PROB-0008
  title: R01预发布监控沿用P00标签且错误响应混淆RequestId与TraceId
  status: SOLVED
  root_cause: R01 smoke栈未接入Prometheus/Alertmanager，旧规则硬编码P00并使用5%/1秒历史阈值；错误响应工厂和Security writer又把requestId写入traceId字段，业务Gauge查询失败仅返回NaN形成告警盲区；业务端口上的未知Actuator资源被兜底异常处理误报为500
  resolution: 建立R01独立可配置子网的监控与告警链，阈值对齐冻结配置2%/500ms；错误响应显式接收真实traceId；新增管理员安全Gauge、查询失败Counter及关键告警与静态门禁；NoResourceFound按冻结404错误码返回
  regression_checks:
  - scripts/check_r01_observability.py
  - services/backend/boot/src/test/java/cc/orbexa/hhy/boot/observability/ObservabilityEndpointsTest.java
  - services/backend/boot/src/test/java/cc/orbexa/hhy/boot/observability/BusinessGaugeBinderTest.java
  - R01 Staging必须取得Prometheus target、真实TraceId和告警firing/resolved回执
  do_not_repeat:
  - 不得用旧版本监控标签或证据替代当前Release现场验收
  - 错误体traceId不得从requestId复制，必须使用入口Filter生成或接受的真实TraceId
  - 业务Gauge查询失败不得只返回NaN而没有独立可告警Counter
- id: PROB-0009
  title: R01预发布登录错误媒体类型被兜底为服务端故障
  status: SOLVED
  root_cause: 全局异常处理未覆盖HttpMediaTypeNotSupportedException，缺少或不受支持Content-Type的请求落入通用500处理并污染RED错误率
  resolution: 将不受支持媒体类型纳入冻结COMMON-400-VALIDATION响应，并新增Web回归测试保证响应不泄露请求体且不调用登录服务
  regression_checks:
  - services/backend/boot/src/test/java/cc/orbexa/hhy/access/admin/AdminSecurityWebSecurityTest.java
  - Maven 21全模块测试和R01 Staging错误媒体类型现场请求必须返回400而非5xx
  do_not_repeat:
  - 客户端可控的协议和媒体类型异常不得落入通用500
  - 异常映射回归测试必须同时断言状态码、稳定错误码和敏感请求体不回显
- id: PROB-0010
  title: 加密快照损坏测试修改Base64末尾填充位导致概率性不变
  status: SOLVED
  root_cause: 回归测试只替换无填充Base64URL密文的最后字符，部分密文长度下被替换的是解码器忽略的未使用低位，解码字节可能保持不变
  resolution: 固定替换密文段首字符，保证认证密文至少一个有效字节发生变化并稳定触发GCM完整性失败
  regression_checks:
  - services/backend/boot/src/test/java/cc/orbexa/hhy/access/admin/AdminSecurityIdempotencySnapshotServiceTest.java
  - Maven 21全模块测试必须连续通过
  do_not_repeat:
  - Base64损坏测试不得只修改可能属于未使用填充位的末尾字符
  - 加密完整性测试必须确定性改变已解码字节
- id: PROB-0011
  title: 无活跃会话的Context Pack会在生成后立即过期
  status: SOLVED
  root_cause: 仓库树指纹包含运行时STATE.yaml，而Context Pack在计算指纹后会更新该状态文件。
  resolution: 仓库树指纹排除STATE.yaml，将其作为运行时元数据而不是项目内容处理。
  regression_checks:
  - tests/test_continuity_cross_release_close.py
  - scripts/continuity.py context
  do_not_repeat:
  - 无活跃会话的Context Pack生成不得改变自己的树指纹来源
- id: PROB-0012
  title: R02短信认证缺少已激活的阿里云短信供应商
  status: OPEN
  root_cause: 当前接续环境未提供可激活的短信供应商版本、SecretRef或模板配置；该配置生命周期归属R03。
  impact: R02的安全挑战、密码登录、注册和会话逻辑可验证，但短信发送、短信登录、注册短信校验及密码重置不能在真实外部通道完成。
  current_behavior: 服务端在未发现SmsProvider实现时显式失败并返回可追踪错误，不生成测试验证码、不伪造发送成功。
  next_owner: TASK-R03-002
  required_evidence:
  - 受控的阿里云短信SecretRef与模板映射
  - 连接测试、真实发送回执和限流回归
  do_not_repeat:
  - 不得将验证码写入日志、响应体或测试生产路径
  - 不得以模拟发送成功替代外部通道验收
- id: PROB-0013
  title: 现有开发后端缺少受控管理员安全密钥的部署来源
  status: OPEN
  root_cause: 服务器上的旧P00后端容器和其保留的.env文件均不含HHY_ADMIN_JWT_SECRET及HHY_ADMIN_MFA_ROOT_SECRET，而当前后端启动配置要求它们满足最小长度。
  impact: 已构建的R02后端镜像不能替换现有api.orbexa.cc开发容器；自动健康检查失败后已回退到旧健康容器，公网启动接口继续可用。
  current_behavior: 新镜像hhy-backend-p00:r02-b4ec470已保留；旧容器已恢复并通过本地和公网健康探针。未生成、猜测或输出任何密钥。
  next_owner: TASK-R03-002
  required_evidence:
  - 通过SecretRef或等价受控机制提供管理员JWT与MFA根密钥
  - 新镜像启动、Flyway升级和api.orbexa.cc认证端点健康回执
  do_not_repeat:
  - 不得为了部署通过而生成临时管理员密钥
  - 不得将密钥写入仓库、命令输出或普通部署日志
- id: PROB-0014
  title: R02 Android注册缺少受控的协议版本配置来源
  status: SOLVED
  root_cause: authPostAuthRegister要求提交有效agreementVersions，字段目录要求版本由服务端、配置或上下文提供且禁止客户端硬编码；R02公开契约未提供Android可调用的协议版本配置接口，现有H5注册配置接口计划归属R28。
  resolution: 经CR-0029与CR-0030冻结并实现公开GET /api/v1/auth/registration-config；后端只返回当前生效协议版本ID、编码和生效时间，Android加载后回显编码、要求显式同意并提交版本ID，服务端事务内再次校验并写入user_agreement_acceptances。
  regression_checks:
  - UserAuthPublicSuccessContractTest#registrationConfigIsPublicAndReturnsOnlyCurrentAgreementVersionIdentifiers
  - UserAuthServiceTest#registrationPersistsValidatedInviteAgreementsDeviceAndSessionTogether
  - AuthFormRulesTest#registrationRequiresMatchingPasswordAndAgreementVersion
  - R02 Android testDebugUnitTest lintDebug assembleDebug
  do_not_repeat:
  - 不得在客户端散落硬编码协议版本
  - 不得跳过服务端有效期校验或伪造协议同意记录
- id: PROB-0015
  title: Android邀请码异步校验可误标记已变更的输入值
  status: SOLVED
  root_cause: 注册页发起邀请码校验后仍允许编辑输入，异步成功回调读取可变状态，可能把旧请求的成功结果标记到新邀请码。
  resolution: 提交期间冻结认证表单输入和路由；邀请码校验保存请求快照，只有快照与当前输入完全一致时才记录已校验状态。
  regression_checks:
  - apps/android/feature/auth/src/test/java/cc/orbexa/hhy/auth/AuthFormRulesTest.kt
  - obx-test :feature:auth:testDebugUnitTest
  do_not_repeat:
  - 异步认证回调不得直接把请求前可变输入当作当前已验证值
  - 认证请求提交期间不得允许修改路由或请求字段
- id: PROB-0016
  title: 启动更新链路会直接打开服务端下发的下载地址
  status: SOLVED
  root_cause: StartupGateScreen未校验downloadUrl的协议、主机、端口、用户信息或片段，可能将受污染的更新策略导向任意外部地址。
  resolution: 新增DownloadUrlPolicy，仅接受DOMAIN_PLAN登记的download.orbexa.cc与stg-download.orbexa.cc HTTPS默认端口地址，并拒绝凭据、片段、伪造子域和非法URI；无效地址只显示通用错误且禁用下载按钮。
  regression_checks:
  - apps/android/feature/startup/src/test/java/cc/orbexa/hhy/startup/DownloadUrlPolicyTest.kt
  - obx-test :feature:startup:testDebugUnitTest
  do_not_repeat:
  - 不得把服务端下发的外部URL未经协议与受信主机校验直接交给系统URI处理器
  - 更新下载URL不得携带用户信息、非默认端口或片段
- id: PROB-0017
  title: Android认证失败提示直接展示服务端错误码
  status: SOLVED
  root_cause: 认证页将内部错误码保存在可见UI状态中，并直接渲染为“错误码：...”，导致技术实现字段进入用户界面。
  resolution: 保留错误码用于内部文案映射，但从可见状态移除该字段；页面仅展示面向用户的提示与请求编号，供支持人员关联服务端日志。
  regression_checks:
  - tests/test_r02_auth_slice_contract.py
  - obx-test :feature:auth:testDebugUnitTest
  do_not_repeat:
  - Android面向用户的认证提示不得直接渲染后端错误码、枚举值或内部字段名
  - 需要排障时应显示请求编号，而不是服务端实现细节
- id: PROB-0018
  title: 手工WIP APK未注入真实API地址导致启动显示暂时无法连接
  status: SOLVED
  root_cause: 手工Docker/Gradle构建未传入HHY_API_BASE_URL，BuildConfig回退为安全占位地址https://api.example.invalid；该手工路径未执行正式APK交付证据门禁。
  resolution: 所有assemble/package/bundle任务增加verifyApiBaseUrl前置门禁，拒绝.invalid、非HTTPS、带凭据或带fragment的地址；使用https://api.orbexa.cc重建APK，并从BuildConfig和APK DEX双重反查内嵌地址。
  regression_checks:
  - 未设置HHY_API_BASE_URL时:app:verifyApiBaseUrl必须失败
  - HHY_API_BASE_URL=https://api.orbexa.cc时:app:testDebugUnitTest与:app:assembleDebug通过
  - APK classes8.dex包含https://api.orbexa.cc且与服务器产物SHA-256一致
  - https://api.orbexa.cc/public-api/v1/platform/status返回200
  do_not_repeat:
  - 不得因WIP或手工构建绕过HHY_API_BASE_URL与内嵌地址检查
  - 不得交付任何包含.example.invalid或.invalid端点的APK
- id: PROB-0019
  title: Access Token签名段接受非规范Base64URL编码
  status: SOLVED
  root_cause: 令牌验签只比较Base64URL解码后的签名字节；签名末尾未使用位被改写时，文本已被篡改但Java解码器仍可产生相同字节，导致非规范编码被误接受。
  resolution: 验签前将解码后的签名重新编码并与原始签名段精确比较，只接受无填充Base64URL规范编码，再执行常量时间HMAC字节比较。
  regression_checks:
  - services/backend/boot/src/test/java/cc/orbexa/hhy/access/user/UserTokenServiceTest.java
  - obx-test Maven UserTokenServiceTest 2项通过
  - obx-test Maven verify 130项通过、2项条件式跳过
  do_not_repeat:
  - 不得只按解码后字节等价判断JWT文本签名段有效
  - 所有自定义令牌编码都必须拒绝非规范、带填充或可替代的文本表示
- id: PROB-0020
  title: R02隔离预发布编排缺少用户认证密钥导致API拒绝启动
  status: SOLVED
  root_cause: R02新增用户会话安全配置后，隔离Compose仍只注入三项管理员密钥，未注入用户JWT、Token HMAC和幂等快照根密钥；Spring配置校验因此在启动阶段失败。
  resolution: R02隔离编排将三项用户密钥声明为必填环境变量，静态可观测性门禁逐项验证必填表达式，运行手册同步要求六项应用密钥相互独立并由隔离进程环境注入。
  regression_checks:
  - scripts/check_r02_observability.py
  - docker compose config缺少任一HHY_USER密钥时必须失败
  - R02隔离API完成Flyway V018并通过readiness
  do_not_repeat:
  - 新增非可选安全配置时必须同步所有部署和预发布编排
  - 不得用弱默认值绕过配置绑定或启动安全校验
- id: PROB-0021
  title: R02 Android构建号与应用内发布策略常量不一致
  status: SOLVED
  root_cause: TASK-R02-007将Gradle versionCode升级为10202时，应用内ReleasePolicy仍保留R01的10201；固定工具链的VersionMetadataTest在APK交付前发现漂移并阻止构建。
  resolution: 将Gradle与ReleasePolicy统一为10202，并增加R02单调构建号显式断言；所有APK身份、版本检查请求和交付证据绑定同一源码提交。
  regression_checks:
  - apps/android/app/src/test/java/cc/orbexa/hhy/VersionMetadataTest.kt
  - 固定工具链testDebugUnitTest lintDebug assembleDebug
  - APK badging必须报告versionCode 10202
  do_not_repeat:
  - 版本切换时必须同时更新Gradle构建身份和应用内发布策略常量
  - 不得绕过VersionMetadataTest交付未对齐版本身份的APK
- id: PROB-0022
  title: APK交付脚本将公开版本目录创建为仅root可访问
  status: SOLVED
  root_cause: 远端暂存准备在umask 077生效后同时创建公开版本目录和私有上传目录，导致首次创建的r02-artifacts权限为700；Nginx无法遍历目录，HTTPS完整下载返回404并触发安全回撤。
  resolution: 公开版本目录显式创建并校正为0755，随后才启用umask 077创建私有.uploads暂存目录；交付失败仍只回撤本次新建且哈希匹配的APK。
