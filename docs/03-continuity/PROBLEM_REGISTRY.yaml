  root_cause: prepare_r07_ci_fixture.sh把psql客户端变量ci_phone直接写入DO匿名代码块，且按默认search_path查询Flyway历史表；psql不会解析美元引用块内部的变量占位，预发布数据库的历史表实际位于hhy schema，因此两类环境边界都会在任何夹具数据写入前报错并回滚事务。
