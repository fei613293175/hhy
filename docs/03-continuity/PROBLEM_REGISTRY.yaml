- id: PROB-0042
  title: PostgreSQL CHECK三值逻辑放行空第三方状态的完成记录
  status: SOLVED
  root_cause: R05第三方请求完成约束把多个status IN表达式用OR连接；当status为NULL且completed_at非空时，表达式结果为NULL而不是FALSE，PostgreSQL将CHECK的NULL结果视为通过，静态文本测试无法发现该语义漏洞。
  resolution: 完成约束先强制新记录status非空，再在显式括号内分别校验处理中状态不得有完成时间、终态必须有合法完成时间；一次性PostgreSQL17.10测试加入空状态带完成时间的拒绝用例并执行完整回滚重放。
  regression_checks:
  - database/tests/r05_identity_invariants.sql R05_PROVIDER_COMPLETION_WITHOUT_STATUS_WAS_ACCEPTED
  - scripts/run_r05_database_invariants.sh
  - scripts/run_r05_disposable_postgres_container.sh
  - tests/test_r05_identity_migration.py
  do_not_repeat:
  - PostgreSQL CHECK不得依赖NULL传播后仍期望约束拒绝，必填状态必须用IS NOT NULL显式收口
  - 数据库状态与时间不变量必须在真实PostgreSQL执行错误数据拒绝测试，不能只做SQL文本匹配
  - 迁移完成必须验证空库、回滚、重放和回归数据四个阶段
- id: PROB-0043
  title: R05身份存储直接绑定Instant导致PostgreSQL JDBC拒绝时间参数
  status: SOLVED
  root_cause: R05客户端和后台身份存储把java.time.Instant直接作为JdbcTemplate参数写入timestamptz列；H2测试接受该类型，但PostgreSQL JDBC无法推断Instant对应的SQL类型，首次创建认证会话即失败。存储层又把全部DataIntegrityViolationException都误映射为唯一键业务冲突，遮蔽了真实SQL状态；修正异常保真后进一步发现新建身份档案写入了冻结状态机不存在的PENDING值；原有本地条件测试因未连接真实PostgreSQL而未暴露这些差异。
  resolution: 两套R05 PostgreSQL存储的创建、计数、活体绑定、过期、重试、审核、冻结和媒体令牌时间参数统一转换为UTC OffsetDateTime，新建档案使用冻结状态机中的SESSION_CREATED；只有PostgreSQL SQLSTATE 23505才映射为重复业务冲突，其他完整性错误保留原始异常用于正确诊断；真实PostgreSQL集成测试显式验证会话到期时间保存精度，并让测试自身的数据库准备语句使用同一明确类型，清理阶段不再违反不可变Outbox规则。
  regression_checks:
  - R05IdentityPostgresStoreTest#createAttachReadAndRetryBindUtcTimestampsAndEncryptProviderPayloadOnPostgres
  - services/backend/mvnw.cmd -pl boot -am test
  - obx-test PostgreSQL17 disposable integration gate
  do_not_repeat:
  - PostgreSQL timestamptz参数不得依赖驱动推断java.time.Instant，统一绑定OffsetDateTime或显式SQL类型
  - 不得把所有DataIntegrityViolationException统一翻译成重复业务提示，必须先核对SQLSTATE或约束名
  - 身份档案和身份会话写入值必须来自数据库冻结状态集合，不得自行引入PENDING等近义状态
  - H2通过不得替代真实PostgreSQL的存储适配验证
  - 新增PostgreSQL存储方法时必须覆盖至少一次真实写入和回读，不得只做SQL文本或Mock验证
  - 集成测试不得为清理数据而删除或篡改不可变Outbox事件，一次性数据库由容器整体销毁
