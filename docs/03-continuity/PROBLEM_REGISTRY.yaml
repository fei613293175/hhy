  resolution: 保留CR-0387的确定尺寸ImageRequest、CR-0388的同期限激活、累计成功和回顶复验，以及CR-0389的稳定列表资源与节点边界手势；CR-0390把所有候选关键资源点击统一为从资源节点向上选择首个enabled且clickable祖先。Run 30235906567/attempt10已证明收藏入口、Compose导航、GET /api/v1/me/favorites 200和两张同源媒体成功，但第三张真实painter已参与渲染时独立onSuccess/onError镜像仍停留loading。CR-0391删除回调镜像，候选语义直接派生rememberAsyncImagePainter的AsyncImagePainter.State。CR-0392进一步让关键导航在同一30秒总期限内先观察目标任一导出phase；只有3秒内无目标phase且源页仍存在时才重新解析当前资源节点及enabled+clickable祖先并重试一次，随后content才继续，其他终态或loading超时立即输出phase、源页、资源和祖先诊断。CR-0393把媒体激活从裸坐标单向滑动改为绑定r13.favorites.list、设置安全gesture margin并在停滞时切换DOWN/UP的结构化双向扫描。attempt13否定该通用滚动策略后，CR-0395保留原30秒和UiAutomator三态独立复验，但改用既有Compose UI测试依赖按三个唯一业务标题逐项performScrollTo，最后再performScrollTo首项；CR-0394的分类方案因三个夹具均为PROJECT而明确不实施。首个CR-0395修复Commit 8a73630d7cda118fa7fb88942e38b06939dc95a4通过72项治理回归、UI基础门禁和obx-test固定镜像212任务，随后74项候选授权回归通过；唯一request014已精确绑定CR-0395、该Commit与单次运行上限。CR-0396把候选入口从首页loaded单态收敛为可操作的已认证主框架，home.loaded或home.error均可进入我的，登录、会话验证中和启动失败仍拒绝；该旁路不放宽R13目标接口、phase、三张真实媒体、四张截图或视觉门槛。attempt6至attempt18及attempt14的唯一Job重跑均保持已消费且不得重跑、晋升或交付。CR-0398只授权唯一request015绑定CR-0396首个修复Commit 035a80b21b51f6652cc1bf107a12e457eb06620b与单次运行上限。CR-0399增加的认证主框架和我的导航资源保留为稳定诊断与严格入口，但Attempt16证明它不是前述启动停滞的根因。CR-0401保留CR-0395的三个唯一标题和Compose performScrollTo，在UiAutomator手工启动目标Activity且确认窗口可见后先执行composeRule.waitForIdle，再进入认证主框架等待；失败诊断同时报告启动、维护、网络、更新和登录可见阻断态。Attempt17证明启动前单次同步不能覆盖异步网络完成后的未来工作；CR-0403因此在原30秒认证轮询每轮读取UiAutomator身份前先执行composeRule.waitForIdle。Attempt18进一步把同一调度边界推进到点击后的页面转换；CR-0406因此保留30秒目标页与15秒来源页消失时窗，在两段观测循环每轮先同步Compose，并让失败直接携带required/gone可见性。该修复不放宽启动门禁、登录、R13接口、phase、三张真实媒体、四张截图或视觉门槛，也不授权重跑Attempt18。
