  status: SOLVED
  root_cause: CR-0345固定镜像已在obx-test以新容器和新loopback端口健康启动，但人工部署只验证了新端口本机状态和api.orbexa.cc公网状态200，没有证明两者属于同一容器；现役Nginx仍把api.orbexa.cc代理到旧28099，因此Run 30188636875 attempt2的bootstrap继续命中旧镜像并返回400。GitHub又在安装Java、Android SDK和KVM之后才请求启动码，43秒准备没有产生任何业务测试价值。R13首次受控切流还暴露Cloudflare不会可靠保留客户端X-Request-Id，后端会生成新的响应请求号；旧脚本只按发送值查日志，因而把真实命中候选误判为失败并回滚。Nginx reload后旧worker和Cloudflare既有源站连接还可能在短暂排空窗口内返回旧upstream，单次立即公网探针不能证明最终路由状态。
