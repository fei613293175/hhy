  status: SOLVED
  root_cause: App发布编辑已经通过R04媒体上传器取得mediaIds并提交后端，但R09列表和详情仅使用媒体数量或占位色块，没有加载ContentResource.media中的thumbnailUrl/url；编辑页也只显示已绑定数量，导致用户上传截图在实际页面不可见。首轮候选功能旅程未断言媒体容器，视觉审核才发现该跨层闭环缺口。
