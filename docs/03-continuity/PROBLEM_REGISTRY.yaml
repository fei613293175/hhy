- id: PROB-0095
  title: R09隔离Staging单一入口未自启动导致全新工作区静默退出
  status: SOLVED
  root_cause: R09从R08复用现场验收脚本时只替换了版本、指标和隔离配置，保留了“外部已提前启动Compose”的隐含前置条件；脚本入口直接调用refresh_containers，空项目中ps返回空标识并因set -e退出，既没有构建启动环境，也没有阶段诊断。首次补自启动后又沿用了未核对的172.31.249.0/24和39593端口，而该服务器R05占用该子网、R06 Alertmanager占用该端口。网络端口修正后，脚本只等待Prometheus进程ready却未等待首次抓取完成，立即保存到activeTargets空数组并由grep静默退出。三者共同说明复制版本脚本时缺少从全新环境执行的时序与资源核对。
  resolution: CR-0255不新增平行流程，直接修复既有run_r09_staging_acceptance.sh；入口检查同名Compose项目必须为空，自行执行up -d --build并确认四个关键容器标识后再进入原有验收。根据服务器实际Docker清单把R09默认子网冻结为172.31.243.0/24、Prometheus回环端口冻结为39597；基线采集在进程ready后继续等待目标首次health=up，并为基线、两类告警、回滚和证据终结输出明确阶段标识。冻结Commit d056c54fb4a9e92f299a3ba78f0bc043706bd58b已在全新项目完成V035、两类告警送达、Outbox合法终结、同库同卷回切和22文件哈希验收，问题关闭为SOLVED。
  regression_checks:
  - python scripts/check_r09_observability.py必须通过并检查R09_STAGING_PROJECT_NOT_EMPTY、R09_STAGING_BUILD_AND_START和up -d --build
  - 全新obx-test工作区只执行scripts/run_r09_staging_acceptance.sh即可自行构建和启动hhy-r09-staging
  - 同名Compose项目已有容器时脚本必须在任何重建或回滚前明确输出R09_STAGING_PROJECT_NOT_EMPTY并拒绝执行
  - 最终证据必须绑定新的冻结Commit且machine-summary、SHA256SUMS和V035同库同卷回滚均通过
  - R09默认172.31.243.0/24必须与服务器Docker网络清单无重叠，换服务器时必须先核对并通过环境变量成组覆盖子网和静态IP
  - R09默认Prometheus回环端口39597必须无占用；HTTP 38109和Alertmanager 39596同样必须在启动前由Compose现场验证
  - Prometheus /-/ready成功后必须继续等待api:9091目标首次health=up，activeTargets为空时不得直接进入证据断言
  do_not_repeat:
  - 不得把人工执行docker compose up作为“单一入口”的未记录前置条件
  - 不得在set -e脚本中让关键阶段以无诊断的空值test退出
  - 从前一版本复制验收脚本时必须在全新Compose项目验证从零启动，不能只验证已存在环境
  - 不得按版本号猜测或递增Docker子网；必须读取目标服务器现有网络清单后冻结未占用范围
  - 不得只检查子网而遗漏宿主机发布端口；网络和端口必须作为同一个隔离资源清单核对
  - 不得把监控进程ready等同于目标已完成首次抓取；涉及目标和告警的验收必须显式等待状态条件
- id: PROB-0096
  title: R09候选固定数据复跑尝试更新不可变内容版本
  status: SOLVED
  root_cause: R09候选夹具从普通可变详情表沿用了ON CONFLICT DO UPDATE写法到hhy.content_versions；该表由数据库触发器强制不可变，因此首次准备成功、第二次幂等复跑在更新历史快照时被正确拒绝。静态测试只检查了V035、真实字段和秘密边界，没有冻结不可变历史必须DO NOTHING的语义。
  resolution: CR-0257将content_versions冲突处理改为DO NOTHING并增加源码回归，公网候选数据库连续执行两次均返回同一user=26和content=3；其他可变资料继续受事务、专用CI账号、V035和零统计约束。CR-0259只把根因、证据和禁止复发项写入既有Problem Registry，不新增平行规则或候选流程。
  regression_checks:
  - tests.test_r09_ci_fixture必须断言content_versions使用ON CONFLICT DO NOTHING且禁止DO UPDATE
  - R09候选推送前固定数据脚本必须连续执行两次并返回相同user与content编号
  - 两次复跑必须在同一事务保护和专用Staging CI账号边界内完成，不得修改历史版本快照
  - Problem Registry YAML解析和严格连续性门禁必须通过
  do_not_repeat:
  - 不可变历史、审计、账本或事件表不得从普通可变资料表复制UPSERT更新策略
  - 候选固定数据的幂等性不得只凭源码推断，必须在目标数据库至少连续实测两次
  - 修复夹具时不得关闭不可变触发器、删除历史行或把失败绕成生产数据修改
- id: PROB-0097
  title: R09启动未生成当前Release并行计划导致Context严格门禁失败
  status: SOLVED
  root_cause: R09从已完成R08交接后直接开始任务，Release级PARALLEL_EXECUTION_PLAN仍只生成到R08；无Active Session时严格检查不会要求当前Release计划，R09-007建立Active Session并刷新Context Pack后才暴露缺失。普通pre-commit只验证提交范围和规则就绪，没有执行完整check_v123_continuity，导致问题延迟到GitHub Continuity Gate。
  resolution: CR-0260按R08既有单主控串行合同补齐R09计划，冻结R09任务分区、最终候选频率、10217 APK身份和异步真机边界；随后通过checkpoint把该文件作为哈希来源纳入Context Pack，并在再次推送前本地执行完整严格连续性检查。Android候选请求不变，因此治理修复提交不会触发第二次模拟器。
  regression_checks:
  - Active Session启动或切换Release后的首个checkpoint必须使Context Manifest包含releases/<当前版本>/PARALLEL_EXECUTION_PLAN.yaml
  - python scripts/check_v123_continuity.py --strict必须在候选推送前本地PASS
  - R09计划必须映射TASK-R09-002至008、最终候选仅R09-007一次、versionCode最低10217和真机异步边界
  - 仅治理文件推送不得修改config/android-candidate-request.yaml或触发第二次Android Candidate Request
  do_not_repeat:
  - 不得把“无Active Session时检查通过”当作下一Release计划已存在的证据
  - 每次跨Release启动前必须核对当前Release计划文件，而不是等版本关闭或远程CI才发现
  - pre-commit严格门禁不能替代候选前完整check_v123_continuity；两者用途不同且不得重复跑模拟器
- id: PROB-0098
