  regression_checks:
  - R09专用Staging夹具连续执行两次并返回同一content及两张media编号
  - 两张候选媒体服务器文件、公网HTTPS下载和仓库夹具SHA-256一致
  - 模拟器断言列表中性应用标识、横向媒体容器、两张真实截图、详情截图画廊与编辑预览
  - 列表media 1/2和详情media 1/2必须分别出现loaded资源标识后才允许截图，error或20秒超时直接失败
  - AI逐图对照B02/P06、B03/P02、B04/P04确认丰富度、层级、真实数据和无虚构内容均PASS
  - 轻量基线晋升必须下载同一源Run产物并核对APK、截图和APPROVAL摘要，禁止重新编译或启动模拟器
  - 固定签名APK必须通过v2/v3、zipalign、版本、正式API基址和四方SHA一致门禁
  do_not_repeat:
  - mediaIds提交成功不等于媒体展示闭环完成，列表、详情、编辑和候选截图必须共同验证
  - 视觉候选不得只断言标题与按钮；涉及真实图片时必须断言媒体容器并由AI检查像素内容
  - 对象键必须保持相对路径并经ACTIVE存储绑定生成HTTPS URL，禁止写绝对URL绕过绑定模型
