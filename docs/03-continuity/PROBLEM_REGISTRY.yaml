  - HHY_DB_SMOKE_CONFIRM=YES时两个R12 PostgreSQL Store测试必须实际运行且0 skipped
  - V001至V040 Flyway迁移和database/tests/r12_review_escalation.sql必须在PostgreSQL17.10通过
  do_not_repeat:
