  - 不得对单模块低风险Bug无理由执行全量集成、版本关闭或拆分多个CR
  - 不得在APK精确下载路由未通过时开始正式构建或请求尚不存在的公网URL
  - 不得因PATH缺少Git、pnpm或本机Android工具链而重复安装、重建或误判仓库
  - 门禁升级必须给出命中路径和风险原因，不得只写为了保险
- id: PROB-0039
  title: 注册专用错误码被Android严格反序列化丢失且无效邀请码触发数据库只读事务异常
  status: SOLVED
  root_cause: Android错误响应模型遗漏服务端固定timestamp字段及错误体details、traceId字段，在禁止未知字段的严格解析下整包解码失败，手机号已注册专用错误码因此退化为通用409提示；邀请码预校验复用了带FOR SHARE的注册锁查询，而校验服务运行在只读事务中，不存在的邀请码落库查询时触发500。
  resolution: Android错误模型补齐timestamp、details和traceId并用真实服务端错误包回归；邀请码普通校验改用无锁只读查询，正式注册单独使用FOR SHARE锁查询，既消除只读事务500又保留注册过程的并发保护。
  regression_checks:
  - ApiModelsSerializationTest#errorEnvelopeDecodesStableCodeWithoutRelaxingUnknownFields
  - UserAuthServiceTest#inviteValidationReturnsDedicatedActionableCode
  - UserAuthServiceTest#registrationReturnsDedicatedCodeForAnExistingPhoneAfterChallengeVerification
  - obx-test Android core-network/auth unit tests and lintDebug
  do_not_repeat:
  - 严格客户端响应模型必须覆盖服务端统一信封的全部固定字段，测试样例必须来自真实信封结构
  - 只读事务不得调用SELECT FOR UPDATE或FOR SHARE等锁查询
  - 预校验与正式提交需要不同并发语义时必须拆分存储方法，不得共用会导致事务属性冲突的查询
  - 用户可处理的手机号已注册和邀请码无效不得退化为通用失败或服务不可用文案
- id: PROB-0040
  title: 跨版本关闭未回填最终绿提交导致发布门禁重复人工修正
  status: SOLVED
  root_cause: continuity close虽然接收并记录code_commit，但update_current_status_closed没有接收该值，CURRENT_STATUS.last_green_commit因此长期停留在R01；R03其他关闭证据全部通过后仍被CURRENT_GREEN_COMMIT_MISMATCH阻断。
  resolution: close把code_commit显式传入update_current_status_closed，COMPLETED时原子写回last_green_commit；跨版本隔离测试新增精确断言，R03当前状态同步到已验收APK源码Commit 660d148；实现与全套接续自测证据绑定Commit 09dec08d8af7fc2c25d4fa3f2425d2e85359b4f8。
  regression_checks:
  - tests/test_continuity_cross_release_close.py
  - scripts/run_continuity_self_test.py
  - scripts/check_v123_continuity.py --strict
  - scripts/check_release_artifacts.py --release R03 --close-gate
  do_not_repeat:
  - 版本关闭不得只在Session和事件中记录code_commit而遗漏CURRENT_STATUS.last_green_commit
  - 发布关闭门禁发现绿提交漂移时必须修复状态生成逻辑，不得逐版本手工改值后忽略根因
  - COMPLETED以外的BLOCKED或ABANDONED结果不得把未通过版本误标为last_green_commit
