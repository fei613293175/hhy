  - Navigation返回栈正确不等于页面业务状态自动保存，跨子页面必须明确区分remember与rememberSaveable
  - 只允许保存恢复页面所需的非敏感最小条件，禁止保存联系方式明文、令牌或授权响应
  - Dialog、ModalBottomSheet和Popup均按独立语义窗口处理，不得依赖父页面资源ID导出
- id: PROB-0074
  title: 新Release缺少视觉基线导致完整GitHub模拟器必然重复运行
  status: SOLVED
  root_cause: 旧Android候选门禁从R06起无条件要求截图与仓库批准基线比较，但新Release首次候选在AI看到真实截图前不可能已有合法基线；因此即使编译、仪器测试、日志、页面身份、稳定性和跨页差异全部通过，也会因基线目录不存在确定性失败，AI批准同一批截图后还必须再次完整编译和启动模拟器。本机既有x86 AVD又因Windows未启用硬件虚拟化驱动而不能作为可靠替代。
  resolution: CR-0197建立两阶段但单模拟器流程：首次无基线且唯一失败为基线缺失时输出BASELINE_REVIEW_REQUIRED并上传原APK、报告和截图；AI逐图批准并登记同一GitHub Run、Commit和SHA-256后，独立轻量Actions下载原工件，复核唯一缺口、图片、APK、来源与仓库基线完全一致后晋升PASS。晋升工作流静态禁止Gradle和Emulator；CR-0198把规则写入真实踩坑文件路径。
  regression_checks:
  - python -m unittest tests.test_android_ci_gate
  - python scripts/android_ci_gate.py policy-check
  - Android baseline promotion workflow不得包含gradlew或android-emulator-runner
  - R07首次基线必须绑定同一候选Run的四张原始截图、APK和SHA-256并由轻量晋升PASS
  do_not_repeat:
  - 不得为登记刚采集的同一批视觉基线再次运行完整编译或模拟器
  - BASELINE_REVIEW_REQUIRED不得允许项目所有者测试、正式Release完成或生产激活
  - 轻量晋升只能接受缺失批准基线这一类失败，任何仪器、JUnit、崩溃、页面身份、稳定性或截图差异失败必须修复后重新候选
  - 晋升提交只能包含对应Release基线原图和APPROVAL，禁止夹带产品代码或治理脚本变更
- id: PROB-0075
  title: Linux Git中文路径转义导致基线晋升白名单误拒绝
  status: SOLVED
  root_cause: Android轻量晋升Run 29876741055在14秒内终止于路径解析；Windows仓库已配置core.quotepath=false所以本地同逻辑通过，GitHub Linux干净克隆仍使用默认true，git diff会把中文CR文档路径加引号并转为八进制转义，字符串不再以批准的连续性目录前缀开头。
  resolution: CR-0200要求所有参与机器路径判定的diff-tree和diff子进程显式使用git -c core.quotepath=false，确保跨平台输出真实UTF-8路径；白名单继续检查采集Commit到HEAD全范围且仍禁止产品代码。APPROVAL只增加晋升尝试记录，四张PNG、原APK和Run 29875839322哈希不变；重试只执行轻量下载与哈希晋升。
  regression_checks:
  - Python静态回归必须断言晋升工作流的diff-tree和diff均显式core.quotepath=false
  - git -c core.quotepath=true diff必须可复现中文路径转义，显式false必须输出真实docs/03-continuity/change-requests路径
  - 第二次晋升不得包含gradlew或android-emulator-runner且必须复用Run 29875839322工件
  do_not_repeat:
  - 用Git机器输出做路径白名单、清单或安全判定时不得依赖用户级core.quotepath配置
  - Windows本地通过不能证明Linux干净克隆的非ASCII路径字符串相同，必须在命令本身固定quotepath
  - 轻量治理失败不得重新触发已通过的完整编译或模拟器，修复后只重跑失败的轻量阶段
- id: PROB-0076
  title: 历史机器完成OwnerPending被误判为后续Release依赖失败
  status: SOLVED
  root_cause: 跨Release独立启动校验只豁免当前正在关闭Release的异步Owner门禁；当R08同时依赖R06和R07时，R06虽已由Manifest证明机器交付PASS、Owner真机PENDING且允许后续开发，其最后一个BLOCKED关闭任务仍被机械加入未完成依赖，导致R07切换R08确定性失败。
  resolution: CR-0204允许完整满足异步Owner Manifest事实的历史Release只豁免最后一个状态为BLOCKED的外部门禁任务；当前Release继续沿用原有精确任务豁免，任何更早未完成任务仍阻断。规则写入全局踩坑并增加多代依赖正反向回归，不改变正式验收和生产激活门禁。
  regression_checks:
  - python -m unittest tests.test_continuity_cross_release_close
  - R08依赖R06与R07时，R06仅TASK-R06-008为BLOCKED且Manifest完整应允许从TASK-R08-001开始
  - 把R06任一更早任务改为READY后必须返回目标Release依赖尚未全部GREEN
  do_not_repeat:
  - 不得把Owner异步PENDING等同于产品机器能力未完成
  - 不得仅凭任务名或BLOCKED状态放行，必须核验完整Manifest机器完成与生产阻断事实
  - 历史Release只能豁免最后一个外部门禁任务，其他未完成任务仍是硬阻断
  - 继续开发不等于正式验收或生产激活通过，不得改写owner_physical_test
- id: PROB-0077
  title: Context来源规范化哈希被原始CRLF字节误判为过期
  status: SOLVED
  root_cause: Context Pack生成器使用portable_source_record把文本换行统一为LF后记录来源SHA和字节数，但V1.2.3严格校验器直接计算工作树原始字节SHA；Windows检出的CRLF文件与Linux的LF文件即使Git语义和规范化内容完全相同，也会被误报CONTEXT_SOURCE_STALE。R08的ACCEPTANCE_MATRIX.csv稳定复现该假失败。
  resolution: CR-0208让严格校验器复用同一个portable_source_record，并同时比较规范化SHA与字节数；新增LF生成记录、CRLF复核通过以及真实内容变化仍失败的正反向回归。Manifest格式和真实篡改阻断保持不变。
  regression_checks:
  - python -m unittest tests.test_context_pack_parallel_policy
  - python scripts/check_v123_continuity.py --strict
  - R08 ACCEPTANCE_MATRIX.csv在Windows CRLF工作树中必须与Context Pack规范化来源记录匹配
  do_not_repeat:
  - 同一份跨平台清单的生成端与校验端不得分别使用规范化文本哈希和原始字节哈希
  - 不得通过强制改写业务CSV换行来掩盖校验算法不一致
  - 兼容LF与CRLF不等于忽略内容变化，必须同时核对规范化SHA和字节数并保留负向回归
