version: 1.2.2
rules:
  database_storage: varchar code
  unknown_value_rejected: true
  changes_require_migration_and_change_request: true
  single_source_of_truth: database/state_machines.yaml + database/enum_registry.yaml
enums:
- code: CONTENT_STATUS
  values:
  - DRAFT
  - PENDING_REVIEW
  - REVIEWING
  - REJECTED
  - APPROVED
  - ONLINE
  - OFFLINE_BY_OWNER
  - OFFLINE_BY_PLATFORM
  - RECTIFICATION
  - BANNED
  - DELETED
- code: RED_PACKET_STATUS
  values:
  - DRAFT
  - PRE_REVIEWING
  - PRE_REVIEW_REJECTED
  - PRE_REVIEW_APPROVED
  - WAITING_PAYMENT
  - PAYMENT_PROCESSING
  - ACTIVE
  - PAUSED_BY_CONTENT_OFFLINE
  - PAUSED_BY_OWNER
  - PAUSED_BY_RISK
  - SOLD_OUT
  - CLOSED_BY_OWNER
  - TERMINATED_BY_PLATFORM
- code: ORDER_STATUS
  values:
  - PENDING_PAYMENT
  - PAYMENT_PROCESSING
  - PAID
  - FULFILLING
  - COMPLETED
  - PAYMENT_FAILED
  - CLOSED
  - CHANNEL_REVERSAL
- code: REWARD_STATUS
  values:
  - PENDING_SETTLEMENT
  - AVAILABLE
  - RISK_FROZEN
  - WITHDRAWAL_FROZEN
  - WITHDRAWN
  - REVERSED
- code: WITHDRAWAL_STATUS
  values:
  - CREATED
  - RISK_REVIEWING
  - FINANCE_REVIEWING
  - APPROVED
  - PAYOUT_PROCESSING
  - SUCCEEDED
  - FAILED
  - REJECTED
  - CANCELLED
- code: IDENTITY_STATUS
  values:
  - NOT_STARTED
  - SESSION_CREATED
  - LIVENESS_PENDING
  - PROVIDER_PROCESSING
  - MANUAL_REVIEW
  - VERIFIED
  - REJECTED
  - EXPIRED
- code: MEMBERSHIP_PLAN
  values:
  - NORMAL
  - MONTH
  - QUARTER
  - YEAR
- code: TRAFFIC_TYPE
  values:
  - ORGANIC_TRAFFIC
  - INCENTIVIZED_RED_PACKET_TRAFFIC
  - INCENTIVIZED_TASK_TRAFFIC
- code: BUILD_JOB_STATUS
  values:
  - QUEUED
  - PREPARING
  - BUILDING
  - TESTING
  - SIGNING
  - UPLOADING
  - SUCCEEDED
  - FAILED
  - CANCELLED
- code: CONFIG_VERSION_STATUS
  values:
  - DRAFT
  - VALIDATED
  - CONNECTION_TESTED
  - PENDING_APPROVAL
  - ACTIVE
  - SUPERSEDED
  - REJECTED
  - ROLLED_BACK
- code: OUTBOX_STATUS
  values:
  - PENDING
  - PUBLISHING
  - PUBLISHED
  - RETRY_WAIT
  - DEAD_LETTER
- code: ACCOUNTING_DIRECTION
  values:
  - DEBIT
  - CREDIT
