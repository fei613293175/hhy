security_assertions:
- surface: SCR-ME-002
  marker: hhy.screen.r12.profile.content
  rule: profile evidence may show only the server-masked phone and must never expose raw account credentials
- surface: SCR-PUB-006
  marker: hhy.screen.r12.publish.preview.content
  rule: preview evidence may render only public media URLs and localized business labels
- surface: SCR-MYC-004
  marker: hhy.screen.r12.content-reviews
  rule: owner review evidence must not expose reviewer identifiers, command identifiers, or internal decision codes
