security_assertions:
- surface: SCR-DETAIL-001
  marker: r08.project.contact
  rule: only masked availability is visible before an explicit contact access; plaintext is forbidden in screenshots
- surface: SHEET-CONTACT-001
  marker: hhy.sheet.r07.contact
  rule: actual contact remains in a FLAG_SECURE transient sheet; the audit asserts its marker and actions but intentionally produces no screenshot
