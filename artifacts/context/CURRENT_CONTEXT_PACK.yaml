  user_request: P00版本完成后先暂停推进；项目所有者已确认真机测试正常并要求尽快完成P00
  reason: 终态关闭门禁要求RELEASE_MANIFEST精确声明3个已实现operationId，现有HTTP路径列表无法通过机器校验
