hard_rules:
- 不得依赖旧对话补充仓库已有需求
- 未领取任务和会话不得编辑项目文件
- 项目内容变化后必须先创建检查点再提交
- 冻结事实变化必须关联已批准CR
- 交接必须生成Handoff Bundle或完成干净提交
- 存在安全且路径互斥的工作包时主控自动委托1至3个执行代理，无需逐次用户确认
- 未委托或运行环境不支持代理时必须记录原因，禁止伪造并行证据
