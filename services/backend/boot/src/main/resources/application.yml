spring:
  application:
    name: hhy-backend
  datasource:
    url: ${HHY_DB_URL:jdbc:postgresql://localhost:5432/hhy}
    username: ${HHY_DB_USER:hhy}
    password: ${HHY_DB_PASSWORD:local-dev-only}
    hikari:
      maximum-pool-size: ${HHY_DB_POOL_MAX:20}
      minimum-idle: ${HHY_DB_POOL_MIN:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: hhy
    default-schema: hhy
    create-schemas: true
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server:
  port: ${HHY_HTTP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
hhy:
  platform:
    maintenance: ${HHY_MAINTENANCE:false}
    maintenance-message: ${HHY_MAINTENANCE_MESSAGE:系统维护中}
    registration-enabled: ${HHY_REGISTRATION_ENABLED:true}
    publishing-enabled: ${HHY_PUBLISHING_ENABLED:true}
    red-packet-enabled: ${HHY_REDPACKET_ENABLED:false}
    withdrawal-enabled: ${HHY_WITHDRAWAL_ENABLED:false}
    latest-version-code: ${HHY_LATEST_VERSION_CODE:1}
    latest-version-name: ${HHY_LATEST_VERSION_NAME:1.2.2-dev}
    minimum-supported-version-code: ${HHY_MIN_VERSION_CODE:1}
    download-url: ${HHY_APK_DOWNLOAD_URL:https://download.orbexa.cc/app/dev.apk}
    apk-sha256: ${HHY_APK_SHA256:unset}
    release-notes: ${HHY_RELEASE_NOTES:V1.2.2工程基线}
