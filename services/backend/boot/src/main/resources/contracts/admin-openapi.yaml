components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshTokenAuth:
      type: apiKey
      in: header
      name: X-Refresh-Token
    MfaTicketAuth:
      type: apiKey
      in: header
      name: X-MFA-Ticket
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
  parameters:
    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID/ULID。相同主体、操作和键必须返回首次结果；请求摘要不一致返回 COMMON-409-IDEMPOTENCY_CONFLICT。
      schema:
        type: string
        minLength: 16
        maxLength: 128
    XProviderTimestamp:
      name: X-Provider-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: ^\d{10,13}$
    XProviderNonce:
      name: X-Provider-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XProviderSignature:
      name: X-Provider-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 1024
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 10
          minLength: 4
        message:
          type: string
          maxLength: 2000
      required:
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - success
      - requestId
      - error
      properties:
        success:
          type: boolean
          const: false
        requestId:
          type: string
          maxLength: 64
        timestamp:
          type: string
          format: date-time
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_-]+$
              example: COMMON-400-VALIDATION
            message:
              type: string
              maxLength: 500
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retryable:
              type: boolean
            traceId:
              type: string
              maxLength: 64
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int64
          minimum: 0
        total:
          type: string
          maxLength: 2000
        nextCursor:
          type: string
          maxLength: 2000
        hasMore:
          type: string
          maxLength: 2000
      required:
      - pageSize
      - hasMore
    CommandResultResource:
      type: object
      additionalProperties: false
      properties:
        resourceId:
          type: string
          maxLength: 64
        businessNo:
          type: string
          maxLength: 2000
        status:
          type: string
          maxLength: 2000
        version:
          type: integer
          format: int64
        acceptedAt:
          type: string
          format: date-time
      required:
      - status
      - acceptedAt
    DeviceResource:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 64
        platform:
          type: string
          maxLength: 2000
        model:
          type: string
          maxLength: 2000
        osVersion:
          type: string
          maxLength: 2000
        appVersion:
          type: string
          maxLength: 2000
        channel:
          type: string
          maxLength: 2000
      required:
      - deviceId
      - platform
    ChallengeResource:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          maxLength: 64
        challengeType:
          type: string
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
        imageBase64:
          type: string
          maxLength: 2000
        token:
          type: string
          maxLength: 2000
      required:
      - challengeId
      - challengeType
      - expiresAt
    AuthSessionResource:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          maxLength: 2000
        refreshToken:
          type: string
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          maxLength: 64
        sessionId:
          type: string
          maxLength: 64
        device:
          $ref: '#/components/schemas/DeviceSummaryResource'
        capabilities:
          type: array
          items:
            type: string
      required:
      - accessToken
      - refreshToken
      - expiresAt
      - userId
      - sessionId
    AdminSessionResource:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          maxLength: 2000
        expiresAt:
          type: string
          format: date-time
