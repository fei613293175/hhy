version: 1.2.2
contract_maturity: FROZEN_FOR_IMPLEMENTATION
transport: WebSocket over TLS
endpoint: wss://ws.orbexa.cc/ws
subprotocol: hhy.v1
serialization: application/json; charset=utf-8
max_payload_bytes: 10485760
authentication:
  request_subprotocols:
    required_exactly_once:
    - hhy.v1
    - hhy.access.<compact-JWT>
    compact_jwt_pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
    padding_allowed: false
    whitespace_allowed: false
    reject_duplicate_or_missing: true
  selected_subprotocol: hhy.v1
  validate_before_upgrade:
  - jwt_signature
  - jwt_expiry
  - session_active
  ws_ticket:
    status: RESERVED_UNAVAILABLE
    query_parameter: wsTicket
    ticket_ttl_seconds: 60
  credential_transport:
    token_in_url_forbidden: true
    token_in_response_forbidden: true
    token_in_error_text_forbidden: true
  log_redaction:
    header: Sec-WebSocket-Protocol
    replacement: '[REDACTED]'
    required_scopes:
    - edge
    - reverse_proxy
    - handshake_error
    - server
    - application
envelope:
  required:
  - eventId
  - eventType
  - occurredAt
  - payload
  properties:
    eventId:
      type: string
      format: uuid
    eventType:
      type: string
    occurredAt:
      type: string
      format: date-time
    traceId:
      type: string
    clientMessageId:
      type: string
    serverSequence:
      type: integer
      minimum: 1
    conversationId:
      type: string
    ackRequired:
      type: boolean
    payload:
      type: object
delivery:
  client_message_id_unique_scope: authenticatedUserId + conversationId + clientMessageId
  server_sequence_scope: authenticatedUserId
  ack_timeout_seconds: 10
  max_redeliveries: 5
  ack:
    s2c_confirmation_event: system.delivery.ack
    match_fields:
    - eventId
    - serverSequence
    match_scope: same authenticated user and actually delivered event
    duplicate_result: IDEMPOTENT_SUCCESS
    unknown_or_mismatched_result: REJECT
    stop_redelivery_only_after_valid_ack: true
    ack_event_ack_required: false
    c2s_confirmations:
      chat.message.send:
        event: chat.message.ack
        match:
        - conversationId
        - clientMessageId
      chat.message.read:
        event: chat.read.updated
        match:
        - conversationId
        - authenticatedUserId=userId
        - lastReadMessageId
  resume:
    query_parameter:
      name: lastServerSequence
      type: integer
      minimum: 0
      zero_means: no event has been processed
      positive_means: highest contiguous processed sequence with every required S2C ACK completed
      reject_above_server_high_watermark: true
    response_event: system.resume
    modes:
      REPLAY_COMPLETE:
        affected_scopes: []
        resume_from: serverHighWatermark captured when the handshake was accepted
      REST_GAP_FILL:
        allowed_affected_scopes:
        - CHAT
        - NOTIFICATIONS
        resume_from: server supplied safe watermark after every affected scope is fully refreshed
    gap_fill:
      CHAT:
        operations:
        - chatGetConversations
        - chatGetConversationsByIdMessages
        completion: exhaust every conversations page and every active conversation messages page
      NOTIFICATIONS:
        operations:
        - notificationGetNotifications
        completion: exhaust every notifications page
      reconnect_sequence_source: system.resume.payload.resumeFromServerSequence
      infer_sequence_from_rest_forbidden: true
  retention_hours: 72
  ordering: strict within one conversation; no global ordering guarantee
  typing_event_persisted: false
heartbeat:
  client_interval_seconds: 25
  server_timeout_seconds: 75
  clock_source: server time
reconnect:
  strategy: full jitter exponential backoff
  initial_delay_ms: 500
  max_delay_ms: 30000
  reset_after_stable_seconds: 60
errors:
- code: WS-400-BAD_ENVELOPE
  closeCode: 4400
- code: WS-401-UNAUTHENTICATED
  closeCode: 4401
- code: WS-403-FORBIDDEN
  closeCode: 4403
- code: WS-409-SEQUENCE_GAP
  closeCode: 4409
- code: WS-429-RATE_LIMITED
  closeCode: 4429
events:
- code: chat.message.send
  direction: C2S
  description: 发送文本、图片、联系方式或内容卡片
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: true
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - clientMessageId
    - messageType
    - payload
    properties:
      conversationId:
        type: string
        maxLength: 64
      clientMessageId:
        type: string
        maxLength: 64
      messageType:
        type: string
        maxLength: 32
        enum:
        - TEXT
        - IMAGE
        - CONTENT_CARD
        - CONTACT_CARD
      payload:
        $ref: '#/definitions/ChatMessagePayload'
- code: chat.message.ack
  direction: S2C
  description: 服务端持久化确认
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - clientMessageId
    - messageId
    - serverSequence
    - sentAt
    properties:
      conversationId:
        type: string
        maxLength: 64
      clientMessageId:
        type: string
        maxLength: 64
      messageId:
        type: string
        maxLength: 64
      serverSequence:
        type: integer
        format: int64
      sentAt:
        type: string
        format: date-time
- code: chat.message.new
  direction: S2C
  description: 新消息
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: true
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - messageId
    - senderId
    - messageType
    - payload
    - serverSequence
    - sentAt
    properties:
      conversationId:
        type: string
        maxLength: 64
      messageId:
        type: string
        maxLength: 64
      senderId:
        type: string
        maxLength: 64
      messageType:
        type: string
        maxLength: 32
        enum:
        - TEXT
        - IMAGE
        - CONTENT_CARD
        - CONTACT_CARD
      payload:
        $ref: '#/definitions/ChatMessagePayload'
      serverSequence:
        type: integer
        format: int64
      sentAt:
        type: string
        format: date-time
- code: chat.message.read
  direction: C2S
  description: 已读上报
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: true
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - lastReadMessageId
    - clientMessageId
    properties:
      conversationId:
        type: string
        maxLength: 64
      lastReadMessageId:
        type: string
        maxLength: 64
      clientMessageId:
        type: string
        maxLength: 64
- code: chat.read.updated
  direction: S2C
  description: 会话已读游标变化
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - userId
    - lastReadMessageId
    - serverSequence
    properties:
      conversationId:
        type: string
        maxLength: 64
      userId:
        type: string
        maxLength: 64
      lastReadMessageId:
        type: string
        maxLength: 64
      serverSequence:
        type: integer
        format: int64
- code: chat.typing
  direction: BIDIRECTIONAL
  description: 短暂输入状态
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - conversationId
    - userId
    - typing
    - expiresAt
    properties:
      conversationId:
        type: string
        maxLength: 64
      userId:
        type: string
        maxLength: 64
      typing:
        type: boolean
      expiresAt:
        type: string
        format: date-time
- code: notification.new
  direction: S2C
  description: 业务通知
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: true
  payload:
    type: object
    additionalProperties: false
    required:
    - notificationId
    - type
    - title
    - body
    - target
    - serverSequence
    properties:
      notificationId:
        type: string
        maxLength: 64
      type:
        type: string
        maxLength: 2000
      title:
        type: string
        maxLength: 2000
      body:
        type: string
        maxLength: 2000
      target:
        $ref: '#/definitions/NotificationTarget'
      serverSequence:
        type: integer
        format: int64
- code: system.kickout
  direction: S2C
  description: 会话失效或被强制下线
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - reasonCode
    - message
    - serverSequence
    properties:
      reasonCode:
        type: string
        maxLength: 2000
      message:
        type: string
        maxLength: 2000
      serverSequence:
        type: integer
        format: int64
- code: system.ping
  direction: C2S
  description: 心跳
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - clientTime
    properties:
      clientTime:
        type: string
        format: date-time
- code: system.pong
  direction: S2C
  description: 心跳响应
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - serverTime
    properties:
      serverTime:
        type: string
        format: date-time
- code: system.delivery.ack
  direction: C2S
  description: 确认当前认证用户收到的需确认服务端事件
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - eventId
    - serverSequence
    properties:
      eventId:
        type: string
        format: uuid
      serverSequence:
        type: integer
        format: int64
        minimum: 1
- code: system.resume
  direction: S2C
  description: 声明重放完成或要求按服务端水位执行REST补洞
  release: R14/R15
  contract_maturity: FROZEN_V1.2.2
  ack_required: false
  payload:
    type: object
    additionalProperties: false
    required:
    - mode
    - requestedLastServerSequence
    - serverHighWatermark
    - resumeFromServerSequence
    - affectedScopes
    properties:
      mode:
        type: string
        enum:
        - REPLAY_COMPLETE
        - REST_GAP_FILL
      requestedLastServerSequence:
        type: integer
        format: int64
        minimum: 0
      serverHighWatermark:
        type: integer
        format: int64
        minimum: 0
      resumeFromServerSequence:
        type: integer
        format: int64
        minimum: 0
      affectedScopes:
        type: array
        uniqueItems: true
        maxItems: 2
        items:
          type: string
          enum:
          - CHAT
          - NOTIFICATIONS
definitions:
  ChatTextPayload:
    type: object
    additionalProperties: false
    properties:
      text:
        type: string
        maxLength: 5000
      mentionUserIds:
        type: array
        items:
          type: string
          maxLength: 64
        maxItems: 50
    required:
    - text
  ChatImagePayload:
    type: object
    additionalProperties: false
    properties:
      mediaId:
        type: string
        maxLength: 64
      thumbnailUrl:
        type: string
        maxLength: 2048
        format: uri
      width:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000
      height:
        type: integer
        format: int64
        minimum: 1
        maximum: 10000
    required:
    - mediaId
  ChatContentCardPayload:
    type: object
    additionalProperties: false
    properties:
      contentId:
        type: string
        maxLength: 64
      contentType:
        type: string
        maxLength: 32
        enum:
        - PROJECT
        - APP
        - GROUP_CHAT
        - TEAM_LEADER
      title:
        type: string
        maxLength: 160
      coverUrl:
        type: string
        maxLength: 2048
        format: uri
    required:
    - contentId
    - contentType
    - title
  ChatContactField:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
        maxLength: 32
        enum:
        - PHONE
        - WECHAT
        - QQ
        - EMAIL
        - OTHER
      label:
        type: string
        maxLength: 32
      value:
        type: string
        maxLength: 256
        x-sensitive: true
    required:
    - type
    - value
  ChatContactCardPayload:
    type: object
    additionalProperties: false
    properties:
      fields:
        type: array
        minItems: 1
        maxItems: 5
        items:
          $ref: '#/definitions/ChatContactField'
      note:
        type: string
        maxLength: 200
    required:
    - fields
  ChatMessagePayload:
    oneOf:
    - $ref: '#/definitions/ChatTextPayload'
    - $ref: '#/definitions/ChatImagePayload'
    - $ref: '#/definitions/ChatContentCardPayload'
    - $ref: '#/definitions/ChatContactCardPayload'
  NotificationTarget:
    type: object
    additionalProperties: false
    properties:
      targetType:
        type: string
        maxLength: 32
        enum:
        - IN_APP_ROUTE
        - H5_URL
        - NONE
      route:
        type: string
        maxLength: 512
      url:
        type: string
        maxLength: 2048
        format: uri
      requiresLogin:
        type: boolean
    required:
    - targetType
    - requiresLogin
