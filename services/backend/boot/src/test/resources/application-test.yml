spring:
  datasource:
    url: jdbc:h2:mem:hhy-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management:
  server:
    port: 8080
hhy:
  websocket:
    container:
      enabled: false
  content-security:
    contact-root-secret: ${HHY_TEST_CONTENT_CONTACT_ROOT_SECRET:test-only-content-contact-root-secret-at-least-32-characters}
  user-security:
    jwt-secret: ${HHY_TEST_USER_JWT_SECRET:test-only-user-jwt-secret-at-least-32-characters}
    token-hmac-secret: ${HHY_TEST_USER_TOKEN_HMAC_SECRET:test-only-user-token-hmac-secret-at-least-32-characters}
    snapshot-root-secret: ${HHY_TEST_USER_SNAPSHOT_ROOT_SECRET:test-only-user-snapshot-root-secret-at-least-32-characters}
    issuer: test/user
    access-ttl: PT15M
    refresh-ttl: P30D
    idempotency-ttl: PT24H
  admin-security:
    jwt-secret: ${HHY_TEST_ADMIN_JWT_SECRET:test-only-admin-jwt-secret-at-least-32-characters}
    mfa-root-secret: ${HHY_TEST_ADMIN_MFA_ROOT_SECRET:test-only-admin-mfa-root-secret-at-least-32-characters}
    idempotency-hmac-secret: ${HHY_TEST_ADMIN_IDEMPOTENCY_HMAC_SECRET:test-only-idempotency-hmac-secret-at-least-32-characters}
    mfa-secret-directory: ${java.io.tmpdir}/hhy-admin-mfa-test
    issuer: test/admin
    access-ttl: PT8H
    mfa-ticket-ttl: PT5M
    enrollment-ttl: PT10M
    password-min-length: 8
    password-max-length: 20
    password-max-failures: 5
    password-lock-seconds: 900
