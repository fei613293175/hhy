name: Core Product Gate V5
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema pytest
      - run: python tools/governance/hhy_governance.py gate --profile module --commit "$GITHUB_SHA"
