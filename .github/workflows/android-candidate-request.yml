name: Android Candidate Request

on:
  push:
    paths:
      - config/android-candidate-request.yaml

permissions:
  contents: read

concurrency:
  group: android-candidate-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request:
    name: Validate durable candidate request
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
      release: ${{ steps.request.outputs.release }}
      candidate: ${{ steps.request.outputs.candidate }}
      remediation_attempt: ${{ steps.request.outputs.remediation_attempt }}
      request_id: ${{ steps.request.outputs.request_id }}
      attempt_exception_id: ${{ steps.request.outputs.attempt_exception_id }}
      required_fix_commit: ${{ steps.request.outputs.required_fix_commit }}
      effective_attempt_limit: ${{ steps.request.outputs.effective_attempt_limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pyyaml
      - id: request
        run: >-
          python scripts/android_candidate_request.py
          --request config/android-candidate-request.yaml
          --policy config/android-automation.yaml
          --github-output "$GITHUB_OUTPUT"
          --json-output artifacts/android-ci/candidate-request.json
      - name: Verify candidate history contains the approved fix
        if: steps.request.outputs.required_fix_commit != ''
        shell: bash
        run: git merge-base --is-ancestor "${{ steps.request.outputs.required_fix_commit }}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-candidate-request-${{ github.run_id }}
          path: artifacts/android-ci/candidate-request.json
          if-no-files-found: error

  quality:
    name: Run release candidate quality gate
    needs: request
    if: needs.request.outputs.enabled == 'true'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: ./.github/workflows/android-quality-gate.yml
    with:
      release: ${{ needs.request.outputs.release }}
      candidate: ${{ needs.request.outputs.candidate == 'true' }}
      remediation_attempt: ${{ fromJSON(needs.request.outputs.remediation_attempt) }}
      request_id: ${{ needs.request.outputs.request_id }}
      attempt_exception_id: ${{ needs.request.outputs.attempt_exception_id }}
      required_fix_commit: ${{ needs.request.outputs.required_fix_commit }}
      effective_attempt_limit: ${{ fromJSON(needs.request.outputs.effective_attempt_limit) }}
