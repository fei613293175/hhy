name: Continuity Gate
on:
  push:
  pull_request:
permissions: { contents: read }
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml
      - name: Initial repository push or ranged per-commit validation
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python3 scripts/continuity_gate.py --mode ci --strict --base-ref HEAD^ --head-ref HEAD --json-out artifacts/validation/continuity-ci.json
          else
            echo 'Initial repository push'
            python3 scripts/continuity_gate.py --mode ci --strict --head-ref HEAD --json-out artifacts/validation/continuity-ci.json
          fi
      - run: python3 scripts/run_continuity_self_test.py
      - run: python3 scripts/test_continuity_protocol.py
      - run: python3 tests/test_continuity_bootstrap_recovery.py
      - run: python3 tests/test_continuity_cross_release_close.py
      - run: python3 tests/test_release_close_gate.py
      - run: python3 scripts/check_v123_continuity.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-evidence
          path: |
            artifacts/validation/continuity-integration-v1.2.3.json
            artifacts/validation/continuity-lifecycle-integration-v1.2.3.json
            artifacts/validation/project-doctor-v1.2.3.json
