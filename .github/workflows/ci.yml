name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      full:
        description: Run every integration partition
        required: false
        type: boolean
        default: false
permissions: { contents: read }
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.plan.outputs.tooling }}
      contracts: ${{ steps.plan.outputs.contracts }}
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
      database: ${{ steps.plan.outputs.database }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml
      - id: plan
        shell: bash
        run: |
          if [ "${{ inputs.full || false }}" = "true" ]; then
            for job in tooling contracts web backend database android; do
              echo "$job=true" >> "$GITHUB_OUTPUT"
            done
          else
            python scripts/run_affected_tests.py \
              --profile MODULE \
              --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}" \
              --head-ref HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable Git behavior
        run: git config core.quotepath false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml pglast
      - run: python -m unittest discover -s tests -p 'test_*.py'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable Git behavior
        run: git config core.quotepath false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml pglast
      - run: python scripts/sync_runtime_assets.py --check
      - run: python scripts/check_api_contract.py
      - run: python scripts/check_db_schema.py
      - run: python scripts/project-doctor.py --strict
      - run: python scripts/check_release_artifacts.py
      - run: python tests/test_release_close_gate.py
      - run: python scripts/check_p00_observability.py
      - run: python tests/p00/test_p00_test_matrix.py
      - run: python tests/p00/test_secret_defaults.py
      - run: python scripts/run_p00_test_matrix.py --list

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.13.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check && pnpm typecheck && pnpm test && pnpm build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cd services/backend && ./mvnw clean verify

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: hhy
          POSTGRES_PASSWORD: hhy_ci_only
          POSTGRES_DB: hhy_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhy -d hhy_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: scripts/run_postgres_migration_smoke.sh
        env:
          DATABASE_URL: postgresql://hhy:hhy_ci_only@127.0.0.1:5432/hhy_smoke
          HHY_DB_SMOKE_CONFIRM: YES
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cd services/backend && ./mvnw -pl boot -am -Dtest=P00FlywayMigrationTest -Dsurefire.failIfNoSpecifiedTests=false -Dhhy.project.root="$GITHUB_WORKSPACE" test
        env:
          HHY_DB_MIGRATION_TEST_URL: jdbc:postgresql://127.0.0.1:5432/hhy_smoke
          HHY_DB_MIGRATION_TEST_USER: hhy
          HHY_DB_MIGRATION_TEST_PASSWORD: hhy_ci_only
          HHY_DB_SMOKE_CONFIRM: YES

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/android-quality-gate.yml
    with:
      release: DEVELOPMENT
      candidate: false
      remediation_attempt: 1
