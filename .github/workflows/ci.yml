name: CI
on: [push, pull_request]
permissions: { contents: read }
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml pglast
      - run: python scripts/project-doctor.py --strict

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '11.13.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && pnpm typecheck && pnpm test && pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: cd services/backend && ./mvnw clean verify

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: hhy
          POSTGRES_PASSWORD: hhy_ci_only
          POSTGRES_DB: hhy_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhy -d hhy_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: scripts/run_postgres_migration_smoke.sh
        env:
          DATABASE_URL: postgresql://hhy:hhy_ci_only@127.0.0.1:5432/hhy_smoke
          HHY_DB_SMOKE_CONFIRM: YES

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - run: cd apps/android && ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: hhy-debug-apk, path: apps/android/app/build/outputs/apk/debug/*.apk }

  continuity-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --disable-pip-version-check pyyaml
      - name: Initial repository push continuity validation
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python3 scripts/continuity_gate.py --mode ci --strict --base-ref HEAD^ --head-ref HEAD
          else
            echo 'Initial repository push'
            python3 scripts/continuity_gate.py --mode ci --strict --head-ref HEAD
          fi
      - run: python3 scripts/run_continuity_self_test.py
      - run: python3 scripts/test_continuity_protocol.py
      - run: python3 scripts/check_v123_continuity.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-reports
          path: |
            artifacts/validation/continuity-integration-v1.2.3.json
            artifacts/validation/continuity-lifecycle-integration-v1.2.3.json
