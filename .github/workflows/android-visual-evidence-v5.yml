name: Android Visual Evidence V5

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release ID, for example R14
        required: true
        type: string
      commit:
        description: Exact source commit SHA to audit
        required: true
        type: string

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  HHY_API_BASE_URL: https://api.orbexa.cc
  HHY_APP_CHANNEL: official
  HHY_APP_ENVIRONMENT: STAGING

jobs:
  offline-compose-visuals:
    name: Offline Compose visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Bind job to requested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          test "${{ inputs.release }}" = "R14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture offline Compose visual batch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -prop persist.sys.locale=zh-CN
          disable-animations: true
          script: bash scripts/run_android_historical_visual_audit.sh
      - name: Write source binding evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/historical-ui
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/historical-ui")
          screenshots = sorted(p.name for p in (root / "screenshots").glob("*.png"))
          payload = {
              "schema": "hhy.android-visual-evidence/v5.0",
              "release": "${{ inputs.release }}",
              "source_commit": "${{ inputs.commit }}",
              "github_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "candidate": False,
              "network_mode": "OFFLINE_PRODUCTION_COMPOSABLES",
              "expected_screenshot_count": 33,
              "screenshots": screenshots,
          }
          (root / "VISUAL_EVIDENCE.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Collect instrumentation reports
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/historical-ui/test-results
          find apps/android/app/build -path '*/androidTests/connected/*' -type f -print0 \
            | xargs -0 -r cp --parents -t artifacts/historical-ui/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-evidence-v5-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/historical-ui
