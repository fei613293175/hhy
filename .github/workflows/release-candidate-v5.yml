name: Release Candidate V5
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release ID, for example R14
        required: true
        type: string
      commit:
        description: Exact frozen commit SHA
        required: true
        type: string
jobs:
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema pytest
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
      - run: python tools/governance/hhy_governance.py gate --profile candidate --release "${{ inputs.release }}" --commit "${{ inputs.commit }}"
