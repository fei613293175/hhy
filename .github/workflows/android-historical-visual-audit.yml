name: Android Historical Visual Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-historical-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    name: Capture production-composable historical UI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the single offline historical visual batch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -prop persist.sys.locale=zh-CN
          disable-animations: true
          script: |
            adb shell rm -rf /sdcard/Pictures/hhy-ci-screenshots
            cd apps/android
            ./gradlew :app:connectedDebugAndroidTest \
              "-Pandroid.testInstrumentationRunnerArguments.class=cc.orbexa.hhy.HistoricalVisualAuditTest" \
              --no-daemon --no-parallel --max-workers=1 \
              --stacktrace "-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
            cd ../..
            mkdir -p artifacts/historical-ui/screenshots
            adb pull /sdcard/Pictures/hhy-ci-screenshots/. artifacts/historical-ui/screenshots/
            test "$(find artifacts/historical-ui/screenshots -maxdepth 1 -name '*.png' | wc -l)" -eq 22
      - name: Collect instrumentation reports
        if: always()
        run: |
          mkdir -p artifacts/historical-ui/test-results
          find apps/android/app/build -path '*/androidTests/connected/*' -type f -print0 \
            | xargs -0 -r cp --parents -t artifacts/historical-ui/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-historical-visual-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/historical-ui
