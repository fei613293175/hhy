name: Direct Release CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HHY_API_BASE_URL: https://api.orbexa.cc
  HHY_APP_CHANNEL: official
  HHY_APP_ENVIRONMENT: STAGING

jobs:
  web:
    name: Web products
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hhy/admin-web test
      - run: pnpm --filter @hhy/h5 test
      - run: pnpm --filter @hhy/admin-web build
      - run: pnpm --filter @hhy/h5 build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HHY_DB_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/hhy_ci?currentSchema=public
      HHY_DB_MIGRATION_TEST_USER: hhy
      HHY_DB_MIGRATION_TEST_PASSWORD: hhy_ci_password
      HHY_DB_SMOKE_CONFIRM: 'YES'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hhy_ci
          POSTGRES_USER: hhy
          POSTGRES_PASSWORD: hhy_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhy -d hhy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/backend/pom.xml test

  android-build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: r15-debug-apk-${{ github.run_id }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    name: R15 Android emulator interactions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -prop persist.sys.locale=zh-CN
          script: |
            apps/android/gradlew -p apps/android --no-daemon --stacktrace :feature:support:connectedDebugAndroidTest :app:assembleDebug
            mkdir -p artifacts/r15-emulator/r15-visual
            adb pull /sdcard/Android/data/cc.orbexa.hhy.support.test/files/r15-visual/. artifacts/r15-emulator/r15-visual/
            test "$(find artifacts/r15-emulator/r15-visual -name '*.png' | wc -l)" -ge 3
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n cc.orbexa.hhy.debug/cc.orbexa.hhy.MainActivity
            sleep 8
            mkdir -p artifacts/r15-emulator
            adb exec-out screencap -p > artifacts/r15-emulator/startup.png
            adb logcat -d -v threadtime > artifacts/r15-emulator/logcat.txt
            ! grep -E 'FATAL EXCEPTION|ANR in cc\.orbexa\.hhy' artifacts/r15-emulator/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r15-emulator-${{ github.run_id }}
          path: |
            artifacts/r15-emulator
            apps/android/feature/support/build/reports/androidTests
            apps/android/feature/support/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 30
