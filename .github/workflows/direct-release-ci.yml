name: Direct Release CI

on:
  push:
    branches:
      - main
      - 'task/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  HHY_API_BASE_URL: https://api.orbexa.cc
  HHY_APP_CHANNEL: official
  HHY_APP_ENVIRONMENT: STAGING

jobs:
  web:
    name: Web products
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hhy/admin-web test
      - run: pnpm --filter @hhy/h5 test
      - run: pnpm --filter @hhy/admin-web build
      - run: pnpm --filter @hhy/h5 build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HHY_DB_MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/hhy_ci?currentSchema=public
      HHY_DB_MIGRATION_TEST_USER: hhy
      HHY_DB_MIGRATION_TEST_PASSWORD: hhy_ci_password
      HHY_DB_SMOKE_CONFIRM: 'YES'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hhy_ci
          POSTGRES_USER: hhy
          POSTGRES_PASSWORD: hhy_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhy -d hhy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyYAML==6.0.2
      - run: python scripts/check_r19_observability.py
      - run: python scripts/check_r20_observability.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/backend/pom.xml test

  android-build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: r22-debug-apk-${{ github.run_id }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-emulator:
    name: R22 Android emulator interactions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -prop persist.sys.locale=zh-CN
          script: |
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell input keyevent KEYCODE_BACK || true
            apps/android/gradlew -p apps/android --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cc.orbexa.hhy.HistoricalVisualAuditTest :app:assembleDebug
            mkdir -p artifacts/r22-emulator/r22-visual artifacts/reports/R20/visual/android artifacts/reports/R21/visual artifacts/reports/R22/visual
            adb pull /sdcard/Pictures/hhy-ci-screenshots/. artifacts/r22-emulator/r22-visual/
            test "$(find artifacts/r22-emulator/r22-visual -name '*-r20-scr-rp-adv-*.png' | wc -l)" -ge 4
            test "$(find artifacts/r22-emulator/r22-visual -name '*-r21-scr-rp-adv-*.png' | wc -l)" -ge 2
            test "$(find artifacts/r22-emulator/r22-visual -name '*-r22-scr-rp-*.png' | wc -l)" -ge 4
            cp artifacts/r22-emulator/r22-visual/47-r20-scr-rp-adv-001.png artifacts/reports/R20/visual/android/SCR-RP-ADV-001.png
            cp artifacts/r22-emulator/r22-visual/48-r20-scr-rp-adv-002.png artifacts/reports/R20/visual/android/SCR-RP-ADV-002.png
            cp artifacts/r22-emulator/r22-visual/49-r20-scr-rp-adv-003.png artifacts/reports/R20/visual/android/SCR-RP-ADV-003.png
            cp artifacts/r22-emulator/r22-visual/50-r20-scr-rp-adv-004.png artifacts/reports/R20/visual/android/SCR-RP-ADV-004.png
            cp artifacts/r22-emulator/r22-visual/51-r21-scr-rp-adv-005.png artifacts/reports/R21/visual/SCR-RP-ADV-005.png
            cp artifacts/r22-emulator/r22-visual/52-r21-scr-rp-adv-006.png artifacts/reports/R21/visual/SCR-RP-ADV-006.png
            cp artifacts/r22-emulator/r22-visual/53-r22-scr-rp-001.png artifacts/reports/R22/visual/SCR-RP-001.png
            cp artifacts/r22-emulator/r22-visual/54-r22-scr-rp-002.png artifacts/reports/R22/visual/SCR-RP-002.png
            cp artifacts/r22-emulator/r22-visual/55-r22-scr-rp-003.png artifacts/reports/R22/visual/SCR-RP-003.png
            cp artifacts/r22-emulator/r22-visual/56-r22-sheet-rp-001.png artifacts/reports/R22/visual/SHEET-RP-001.png
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n cc.orbexa.hhy.debug/cc.orbexa.hhy.MainActivity
            sleep 8
            mkdir -p artifacts/r22-emulator
            adb exec-out screencap -p > artifacts/r22-emulator/startup.png
            adb logcat -d -v threadtime > artifacts/r22-emulator/logcat.txt
            ! grep -E 'FATAL EXCEPTION|ANR in cc\.orbexa\.hhy' artifacts/r22-emulator/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-emulator-${{ github.run_id }}
          path: |
            artifacts/r22-emulator
            artifacts/reports/R20/visual/android
            artifacts/reports/R21/visual
            artifacts/reports/R22/visual
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 30
