schema_version: 1
policy_id: HHY-ANDROID-AUTOMATION-V1
status: ENFORCED
enforcement:
  from_release: R06
  grandfathered_releases:
  - release: R05
    reason: versionCode 10213 已于 2026-07-20 获得项目所有者整体真机体验通过
  applies_to:
  - VERSION_CANDIDATE
  - APK_BUGFIX_CANDIDATE
  owner_test_requires_candidate_status: PASS
  release_complete_requires_owner_status: PASS
  next_release_development_requires_owner_status: false
  production_activation_requires_owner_status: PASS
  owner_feedback_non_blocking_for_next_release: true
  owner_feedback_required_per_version_before_next_release: false
  owner_pending_blocks:
  - FORMAL_RELEASE_ACCEPTANCE
  - PRODUCTION_ACTIVATION
  owner_pending_does_not_block:
  - NEXT_RELEASE_DEVELOPMENT
  - MACHINE_CANDIDATE
  - DESKTOP_CANDIDATE_ACCUMULATION
build:
  api_base_url: https://api.orbexa.cc
  java_version: 21
  compile_sdk: 37
  required_gradle_tasks:
  - verifyApiBaseUrl
  - lintDebug
  - testDebugUnitTest
  - assembleDebug
  - assembleDebugAndroidTest
authentication:
  mode: GITHUB_OIDC_ONE_TIME
  bootstrap_ttl_seconds: 600
  bootstrap_ttl_max_seconds: 600
  session_ttl_seconds: 900
  binding_claims:
  - repository
  - workflow_ref
  - commit
  - run_id
  consume_once: true
  production_enabled: false
emulator:
  api_level: 35
  target: google_apis
  architecture: x86_64
  profile: pixel_7
  locale: zh-CN
  orientation: portrait
  visual_manifest_root: tests/android/visual-manifests
  required_journeys:
  - cold_start
  - staging_oidc_session
  - release_visual_matrix
visual:
  baseline_root: tests/android/visual-baselines
  baseline_required_from_release: R06
  baseline_bootstrap:
    mode: SINGLE_EMULATOR_CAPTURE_THEN_LIGHTWEIGHT_PROMOTION
    capture_status: BASELINE_REVIEW_REQUIRED
    promotion_rebuild_allowed: false
    promotion_emulator_allowed: false
    source_binding:
    - github_run_id
    - release
    - commit
    - screenshot_sha256
    - apk_sha256
    promotion_rule: 首版无基线时只允许一次权威模拟器采集；AI批准原始截图和哈希后必须由轻量Actions复核原运行工件并晋升，禁止为了登记同一批基线再次编译或启动模拟器
  max_mean_absolute_error: 14.0
  max_changed_pixel_ratio: 0.10
  changed_pixel_threshold: 24
  minimum_cross_screen_changed_pixel_ratio: 0.005
  stable_sample_interval_ms: 350
  stable_sample_matches: 2
  review_authority: AI_IMPLEMENTATION_AGENT
  ai_acceptance_required_checks:
  - frozen_design_and_token_match
  - expected_screen_identity
  - loaded_business_state
  - stable_pixels
  - distinct_screenshot_sha256
  - no_sensitive_or_technical_text
  rule: 基线必须来自冻结设计施工后的合格模拟器截图；AI实现代理按强制检查自主判定并登记哈希，不得等待项目所有者逐轮核实
logs:
  fatal_patterns:
  - 'FATAL EXCEPTION'
  - 'ANR in cc.orbexa.hhy'
  - 'Process cc.orbexa.hhy.debug has died'
  - 'AndroidRuntime:.*cc.orbexa.hhy'
  forbidden_visible_patterns:
  - 请求编号
  - TraceId
  - 暂时无法连接
remediation:
  max_ai_attempts: 3
  approved_attempt_exceptions:
  - exception_id: CR-0344
    release: R12
    attempt: 4
    request_id: R12-CANDIDATE-20260726-004
    required_fix_commit: daae207af319008411995b7ac23a13c9042fc5a2
    max_candidate_runs: 1
  - exception_id: CR-0352
    release: R12
    attempt: 5
    request_id: R12-CANDIDATE-20260726-005
    required_fix_commit: fbde523e8e751b74f7300ef125c70fa9eb4d03fd
    max_candidate_runs: 1
  failure_issue_title_prefix: '[Android CI]'
  required_status: REMEDIATION_REQUIRED
  retry_rule: 编译或测试确定性失败必须修改后重新提交；仅业务测试开始前且日志明确证明为GitHub、网络、镜像或Staging接口瞬态故障时，允许同一Commit只重跑失败作业及其依赖一次，禁止重跑已通过阶段或修改业务代码；同一瞬态再次出现必须停止重跑并检查Staging健康与基础设施
  transient_retry:
    proof_required: true
    allowed_failure_classes:
    - GITHUB_INFRASTRUCTURE
    - NETWORK
    - RUNNER_IMAGE
    - STAGING_HTTP_5XX_BEFORE_BUSINESS_TEST
    max_same_commit_reruns: 1
    rerun_scope: FAILED_JOBS_AND_DEPENDENTS_ONLY
    preserve_successful_jobs: true
    business_code_change_allowed: false
    repeated_transient_action: STOP_RERUN_AND_DIAGNOSE_STAGING_OR_INFRASTRUCTURE
  escalation_rule: 同一根因连续三轮仍失败或需要项目所有者新增秘密/第三方权限时才允许升级
delivery:
  candidate_status: PASS
  desktop_copy_after_actions_pass: true
  desktop_test_guide_required: true
  owner_feedback_mode: ASYNC_NON_BLOCKING
  owner_feedback_required_before_next_release: false
  production_activation_requires_owner_acceptance: true
  required_evidence:
  - build-report
  - unit-test-report
  - lint-report
  - instrumentation-report
  - screenshots
  - logcat
  - runtime-analysis
  - apk-sha256
  forbid_owner_request_before_pass: true
  forbid_release_completion_before_pass: true
execution_tiers:
  fast_commit:
    trigger: affected Android source or workflow_call with candidate=false
    required:
    - policy_and_api_base_url
    - ui_foundation_and_tokens
    - compile_and_package
    - unit_tests
    - lint
    emulator_allowed: false
    candidate_artifact_allowed: false
  release_candidate:
    trigger: validated config/android-candidate-request.yaml or workflow_dispatch with candidate=true
    required:
    - fast_commit
    - emulator_install_and_journeys
    - screenshots_and_visual_comparison
    - logcat_crash_anr_analysis
    - candidate_report_and_apk
    owner_test_requires_pass: true
candidate_request:
  file: config/android-candidate-request.yaml
  validator: scripts/android_candidate_request.py
  workflow: .github/workflows/android-candidate-request.yml
  reusable_quality_gate: .github/workflows/android-quality-gate.yml
  allowed_releases: R06-R32
  remediation_attempt_range: 1-3
  rule: 候选请求必须进入事实分支并通过同一权威质量门禁；普通请求仅允许1至3，只有approved_attempt_exceptions全字段精确匹配时才允许其登记的单次轮次，且不得改变全局max_ai_attempts=3；视觉证据由AI按版本矩阵自主验收，桌面真机反馈异步进入后续修复队列且不阻断下一版本编码；不得用普通CI的中间APK替代候选产物
