schema_version: 2
status: DIRECT_VERSION_DEVELOPMENT
authority: AGENTS.md
purpose: 按版本直接完成实际产品代码、远程模拟测试和桌面交付

workflow:
  - implement_complete_release_frontend_backend_and_contracts
  - commit_and_push_source
  - github_actions_clean_build_and_emulator_test
  - obx_test_backend_database_signed_apk
  - fix_detected_defects_and_rerun_affected_remote_tests
  - deliver_apk_feature_list_test_list_and_device_guide_to_desktop
  - continue_next_release_without_waiting_for_owner_feedback

disabled_control_flows:
  - governance_v5_orchestrator
  - supervisor
  - run_once
  - run_loop
  - attempt_budget
  - independent_reviewer
  - task_gate
  - module_gate
  - freeze_gate
  - candidate_gate
  - machine_close_gate
  - owner_authorization_for_development

local_machine:
  install_or_start_development_environment: FORBIDDEN
  allowed:
    - source_editing
    - git_operations
    - lightweight_static_checks
    - remote_artifact_download
    - desktop_delivery_preparation

remote_execution:
  source_ci: GITHUB_ACTIONS
  backend_database_and_signed_apk: OBX_TEST_FIXED_TOOLCHAIN
  android_emulator: GITHUB_ACTIONS_FIXED_EMULATOR
  failure_action: FIX_CODE_AND_RERUN_AFFECTED_TESTS

delivery:
  destination: PROJECT_OWNER_DESKTOP
  required:
    - test_apk
    - complete_feature_list
    - automated_test_checklist
    - physical_device_test_guide
    - known_limitations
    - commit_sha_apk_sha256_and_signing_identity
  owner_physical_test: ASYNC
  production_release: OWNER_EXPLICIT_CONFIRMATION_REQUIRED
