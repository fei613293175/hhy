schema: hhy.governance-constitution/v5.0
version: 5.0.0
status: ENFORCED
project: hhy-pro-platform
single_authority:
  product_truth: docs/00-baseline/SOURCE_OF_TRUTH.md
  governance_truth: governance/DEVELOPMENT_CONSTITUTION.yaml
  program_plan: governance/PROGRAM_PLAN.yaml
  task_specs: governance/task_specs/*.yaml
  mutable_state: governance/STATE.yaml
  sole_state_writer: ORCHESTRATOR
  code_trajectory: Git commit graph
  evidence: governance/evidence/**
  generated_views:
    - CURRENT_STATUS.yaml
    - NEXT_TASK.yaml
    - governance/views/**
  historical_only:
    - .continuity/**
    - docs/03-continuity/**
    - legacy CR/Session/Checkpoint/Context Pack
    - releases/*/TASKS.yaml
    - config/test-impact-map.yaml
  never_authoritative:
    - conversation
    - model memory
    - long /goal context
execution:
  model: DETERMINISTIC_ORCHESTRATOR_WITH_EPHEMERAL_CODEX_WORKERS
  development_flow: VERSION_DELIVERY_LOOP
  attempt_fields: HISTORICAL_COMPATIBILITY_ONLY
  stop_on_attempt_exhaustion: false
  one_worker_run_one_task: true
  one_worker_run_one_attempt: true
  fresh_ephemeral_worker_each_attempt: true
  isolated_worker_worktree: true
  isolated_gate_commit: true
  worker_may_select_next_task: false
  worker_may_write_state: false
  worker_may_edit_governance_ci_gate_or_tests: false
  worker_may_stage_commit_merge_push_tag_or_reset: false
  worker_may_declare_pass: false
  orchestrator_only_state_writer: true
  deterministic_gate_only_pass_authority: true
  infrastructure_interrupted_draft_may_resume_same_attempt: true
  restored_draft_requires_full_worker_gate_and_reviewer: true
  no_background_or_unbounded_execution: true
limits:
  total_attempts_per_task: 3
  overrides_allowed: false
  infrastructure_auto_retries: 0
  maximum_worker_tool_calls: 80
  maximum_compactions_per_attempt: 1
  maximum_same_command_same_diff: 1
  run_loop_default_max_runs: 20
  run_loop_absolute_max_runs: 100
  # Keep the controller and both Worker paths bounded to one observable run.
  # This is a responsiveness limit, not a test or release-gate bypass.
  worker_timeout_seconds: 900
  worker_startup_timeout_seconds: 600
  worker_idle_timeout_seconds: 300
  worker_progress_poll_seconds: 15
  gate_timeout_seconds: 1800
fast_lane:
  enabled: true
  applies_to: ALL_RELEASES
  required_for: LARGE_OR_MULTI_DOMAIN_TASKS
  max_read_only_discovery_tool_calls: 12
  first_product_file_deadline_seconds: 600
  checkpoint_interval_minutes: 45
  max_operation_ids_per_slice: 6
  required_slice_order:
    - contract_and_types
    - persistence_and_outbox
    - application_service
    - controller_or_entrypoint
    - migration_and_permissions
    - targeted_tests
  rules:
    - begin_product_edit_before_broad_repository_scan
    - validate_each_compilable_slice_before_next_slice
    - preserve_task_gate_and_independent_reviewer
    - preserve_candidate_commit_identity
    - never_increase_attempt_budget
    - never_create_attempt_four
version_delivery_loop:
  enabled: true
  scope: R15_R32
  sequence:
    - implement_all_release_features
    - compile_and_automated_tests
    - independent_review
    - github_clean_candidate_ci
    - obx_test_signed_test_apk
    - github_fixed_emulator_user_journeys
    - fix_discovered_defects
    - delivery_apk_and_test_checklist
    - machine_close_release
    - activate_next_release
  failure_action: SAVE_DIAGNOSTIC_AND_CONTINUE_SAME_RELEASE
  completion_authority: QUALITY_GATES_AND_MACHINE_CLOSE_ONLY
  local_machine_policy:
    install_or_deploy_build_environment: FORBIDDEN
    start_backend_database_docker_or_emulator: FORBIDDEN
    allowed: SOURCE_EDIT_AND_LIGHTWEIGHT_STATIC_CHECKS_ONLY
  authoritative_execution:
    clean_compile_and_automated_tests: GITHUB_ACTIONS
    signed_test_apk: OBX_TEST_FIXED_TOOLCHAIN
    emulator_user_journeys: GITHUB_ACTIONS_FIXED_EMULATOR
  owner_delivery:
    destination: PROJECT_OWNER_DESKTOP
    required:
      - test_apk
      - complete_feature_list
      - automated_test_checklist
      - physical_device_test_guide
      - known_limitations
    owner_physical_test: ASYNC_PENDING_UNTIL_EXPLICIT_FEEDBACK
attempt_strategies:
  1: direct_implementation_or_fix
  2: fresh_worker_minimal_reproduction_and_root_cause
  3: fresh_worker_alternative_implementation_from_authoritative_baseline
  exhausted: FAILED_BOUNDED
progress:
  large_task_vertical_slices:
    - contract_and_types
    - persistence_and_outbox
    - application_service
    - controller_or_entrypoint
    - migration_and_permissions
    - targeted_tests
  accepted:
    - allowed product or test diff
    - failing test set reduced
    - new deterministic reproduction
    - acceptance FAIL changed to PASS
    - commit-bound artifact or evidence
    - verifiable external blocker evidence
  rejected:
    - planning only
    - self-attestation
    - status/CR/Checkpoint/Session-only changes
    - comments or formatting only
    - repeated command/output/diff
    - governance runtime-only changes
release_flow:
  stages:
    - DEVELOPING
    - MODULE_GREEN
    - FREEZE_READY
    - FROZEN
    - TEST_APK_READY
    - CANDIDATE_GREEN
    - MACHINE_CLOSED
    - OWNER_VERIFICATION_PENDING
    - FORMALLY_ACCEPTED
    - RELEASED
  adjacent_release_only: true
  machine_close_required_for_next_release: true
  owner_feedback_async_and_non_blocking_for_next_release: true
  owner_pass_required_for_formal_release: true
candidate_identity:
  frozen_commit_equals_candidate_commit: true
  apk_source_commit_equals_frozen_commit: true
  screenshots_source_commit_equals_frozen_commit: true
  gate_report_commit_equals_frozen_commit: true
  any_post_freeze_product_change: INVALIDATE
  machine_close_read_only: true
visual_policy:
  product_behavior_source: formal product documents and contracts
  visual_source: approved effect preview or explicit frozen visual specification
  exact_values_source: design tokens
  task_scope: changed pages and direct shared-component dependents
  candidate_scope: current release plus causally impacted history
  full_history_only_when:
    - shared UI foundation changed
    - explicit historical visual audit task
  unrelated_old_visual_defect: LEGACY_VISUAL_DEBT
hard_protections:
  may_not_be_weakened:
    - funds, payment, withdrawal, red-packet budget and ledger invariants
    - secret, SecretRef and credential scanning
    - authentication, authorization, privacy and production test rejection
    - empty database and existing database migrations plus rollback/compatibility
    - OpenAPI, WebSocket and consumer compatibility
    - APK commit, SHA-256, versionCode, versionName and signing identity
    - product documents, UI contracts, effect previews and runtime screenshots
    - owner authorization, release tag, production activation and rollback evidence
blocking:
  external_or_infrastructure_block_does_not_consume_engineering_attempt: true
  transient_provider_auth_failure_is_infrastructure: true
  transient_provider_auth_may_auto_resume_after_health_probe: true
  infrastructure_draft_is_unverified_and_never_bypasses_gate: true
  blocked_task_never_auto_retries: true
  independent_tasks_may_continue_when_dependency_safe: true
  owner_pending_is_not_a_blocker_for_next_release: true
completion:
  final_release: R32
  marker: governance/GOAL_COMPLETE.json
  reject_new_worker_leases_after_complete: true
