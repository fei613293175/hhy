# R14 deployment template only. Production/staging activation remains a separately approved operation.
# Never add $http_sec_websocket_protocol, $request_headers or request-header dumps to this log.
log_format hhy_ws_safe '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time urt=$upstream_response_time';

map $http_upgrade $hhy_ws_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ws.orbexa.cc;

    access_log /var/log/nginx/ws.orbexa.cc.access.log hhy_ws_safe;

    location = /ws {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hhy_ws_connection;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
