server {
    listen 80;
    server_name download.orbexa.cc;

    root /www/wwwroot/download.orbexa.cc;
    index index.html;

    location = /r01-artifacts/hhy-r01-db3cfdd-debug.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="hhy-r01-db3cfdd-debug.apk"' always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
