groups:
  - name: hhy-r14-chat-realtime
    rules:
      - alert: HhyR14BackendDown
        expr: up{job="hhy-backend-r14"} == 0
        for: 15s
        labels: { severity: critical, release: R14 }
        annotations: { summary: 合伙云 R14 Staging 后端不可用 }
      - alert: HhyR14HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r14",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r14"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R14 }
        annotations: { summary: 合伙云 R14 Staging 5xx 比例超过 2% }
      - alert: HhyR14HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r14"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R14 }
        annotations: { summary: 合伙云 R14 Staging P95 延迟超过 500ms }
      - alert: HhyR14UnackedDeliveryBacklog
        expr: hhy_websocket_deliveries_unacked{job="hhy-backend-r14"} > 50
        for: 1m
        labels: { severity: warning, release: R14 }
        annotations: { summary: R14 WebSocket 未确认投递超过 50 条 }
      - alert: HhyR14RetryExhausted
        expr: hhy_websocket_deliveries_retry_exhausted{job="hhy-backend-r14"} > 0
        for: 15s
        labels: { severity: critical, release: R14 }
        annotations: { summary: R14 WebSocket 投递已耗尽重试 }
      - alert: HhyR14GapUsers
        expr: hhy_websocket_gap_users{job="hhy-backend-r14"} > 0
        for: 15s
        labels: { severity: critical, release: R14 }
        annotations: { summary: R14 存在需要权威 REST 补洞的用户 }
      - alert: HhyR14PendingReportBacklog
        expr: hhy_chat_reports_pending{job="hhy-backend-r14"} > 100
        for: 5m
        labels: { severity: warning, release: R14 }
        annotations: { summary: R14 待处理聊天举报超过 100 条 }
      - alert: HhyR14BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r14",metric=~"hhy\\.(chat|websocket|r14)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R14 }
        annotations: { summary: R14 业务指标查询失败，监控结果不可信 }
