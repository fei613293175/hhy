groups:
  - name: hhy-r09-app
    rules:
      - alert: HhyR09BackendDown
        expr: up{job="hhy-backend-r09"} == 0
        for: 15s
        labels: { severity: critical, release: R09 }
        annotations: { summary: 合伙云 R09 Staging 后端不可用 }
      - alert: HhyR09HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r09",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r09"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R09 }
        annotations: { summary: 合伙云 R09 Staging 5xx 比例超过 2% }
      - alert: HhyR09HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r09"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R09 }
        annotations: { summary: 合伙云 R09 Staging P95 延迟超过 500ms }
      - alert: HhyR09OutboxBacklog
        expr: hhy_r09_outbox_backlog{job="hhy-backend-r09"} > 3
        for: 15s
        labels: { severity: warning, release: R09 }
        annotations: { summary: R09 App事件 Outbox 积压超过 3 条 }
      - alert: HhyR09AppContactRejectionBurst
        expr: hhy_app_contact_rejections_5m{job="hhy-backend-r09"} > 10
        for: 1m
        labels: { severity: warning, release: R09 }
        annotations: { summary: 近 5 分钟App联系方式访问拒绝超过 10 次 }
      - alert: HhyR09AppReviewBacklog
        expr: hhy_app_review_pending{job="hhy-backend-r09"} > 100
        for: 5m
        labels: { severity: warning, release: R09 }
        annotations: { summary: 待审核App超过 100 条 }
      - alert: HhyR09BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r09",metric=~"hhy\\.(app|r09)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R09 }
        annotations: { summary: R09 业务指标查询失败，监控结果不可信 }
