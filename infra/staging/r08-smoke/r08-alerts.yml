groups:
  - name: hhy-r08-project
    rules:
      - alert: HhyR08BackendDown
        expr: up{job="hhy-backend-r08"} == 0
        for: 15s
        labels: { severity: critical, release: R08 }
        annotations: { summary: 合伙云 R08 Staging 后端不可用 }
      - alert: HhyR08HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r08",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r08"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R08 }
        annotations: { summary: 合伙云 R08 Staging 5xx 比例超过 2% }
      - alert: HhyR08HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r08"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R08 }
        annotations: { summary: 合伙云 R08 Staging P95 延迟超过 500ms }
      - alert: HhyR08OutboxBacklog
        expr: hhy_r08_outbox_backlog{job="hhy-backend-r08"} > 3
        for: 15s
        labels: { severity: warning, release: R08 }
        annotations: { summary: R08 项目事件 Outbox 积压超过 3 条 }
      - alert: HhyR08ProjectContactRejectionBurst
        expr: hhy_project_contact_rejections_5m{job="hhy-backend-r08"} > 10
        for: 1m
        labels: { severity: warning, release: R08 }
        annotations: { summary: 近 5 分钟项目联系方式访问拒绝超过 10 次 }
      - alert: HhyR08ProjectReviewBacklog
        expr: hhy_project_review_pending{job="hhy-backend-r08"} > 100
        for: 5m
        labels: { severity: warning, release: R08 }
        annotations: { summary: 待审核项目超过 100 条 }
      - alert: HhyR08BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r08",metric=~"hhy\\.(project|r08)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R08 }
        annotations: { summary: R08 业务指标查询失败，监控结果不可信 }
