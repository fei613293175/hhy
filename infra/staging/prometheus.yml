global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/p00-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hhy-backend-p00
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]
        labels:
          environment: staging
          release: P00
