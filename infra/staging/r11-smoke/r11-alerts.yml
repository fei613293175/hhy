groups:
  - name: hhy-r11-team-leader
    rules:
      - alert: HhyR11BackendDown
        expr: up{job="hhy-backend-r11"} == 0
        for: 15s
        labels: { severity: critical, release: R11 }
        annotations: { summary: 合伙云 R11 Staging 后端不可用 }
      - alert: HhyR11HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r11",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r11"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R11 }
        annotations: { summary: 合伙云 R11 Staging 5xx 比例超过 2% }
      - alert: HhyR11HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r11"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R11 }
        annotations: { summary: 合伙云 R11 Staging P95 延迟超过 500ms }
      - alert: HhyR11OutboxBacklog
        expr: hhy_r11_outbox_backlog{job="hhy-backend-r11"} > 3
        for: 15s
        labels: { severity: warning, release: R11 }
        annotations: { summary: R11 团队长事件 Outbox 积压超过 3 条 }
      - alert: HhyR11TeamLeaderContactRejectionBurst
        expr: hhy_team_leader_contact_rejections_5m{job="hhy-backend-r11"} > 10
        for: 1m
        labels: { severity: warning, release: R11 }
        annotations: { summary: 近 5 分钟团队长联系方式访问拒绝超过 10 次 }
      - alert: HhyR11TeamLeaderReviewBacklog
        expr: hhy_team_leader_review_pending{job="hhy-backend-r11"} > 100
        for: 5m
        labels: { severity: warning, release: R11 }
        annotations: { summary: 待审核团队长资料超过 100 条 }
      - alert: HhyR11BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r11",metric=~"hhy\\.(team\\.leader|r11)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R11 }
        annotations: { summary: R11 业务指标查询失败，监控结果不可信 }
