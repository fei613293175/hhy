groups:
  - name: hhy-r13-activity
    rules:
      - alert: HhyR13BackendDown
        expr: up{job="hhy-backend-r13"} == 0
        for: 15s
        labels: { severity: critical, release: R13 }
        annotations: { summary: 合伙云 R13 Staging 后端不可用 }
      - alert: HhyR13HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r13",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r13"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R13 }
        annotations: { summary: 合伙云 R13 Staging 5xx 比例超过 2% }
      - alert: HhyR13HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r13"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R13 }
        annotations: { summary: 合伙云 R13 Staging P95 延迟超过 500ms }
      - alert: HhyR13OutboxBacklog
        expr: hhy_r13_outbox_backlog{job="hhy-backend-r13"} > 3
        for: 15s
        labels: { severity: warning, release: R13 }
        annotations: { summary: R13 活动事件 Outbox 积压超过 3 条 }
      - alert: HhyR13InvalidFeedbackBacklog
        expr: hhy_activity_invalid_feedback_pending{job="hhy-backend-r13"} > 100
        for: 5m
        labels: { severity: warning, release: R13 }
        annotations: { summary: R13 待处理失效反馈超过 100 条 }
      - alert: HhyR13ContactRejectionBurst
        expr: hhy_activity_contact_rejections_5m{job="hhy-backend-r13"} > 20
        for: 1m
        labels: { severity: warning, release: R13 }
        annotations: { summary: R13 五分钟联系方式拒绝超过 20 次 }
      - alert: HhyR13BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r13",metric=~"hhy\\.(activity|r13)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R13 }
        annotations: { summary: R13 业务指标查询失败，监控结果不可信 }
