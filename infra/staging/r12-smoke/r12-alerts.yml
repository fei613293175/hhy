groups:
  - name: hhy-r12-publishing
    rules:
      - alert: HhyR12BackendDown
        expr: up{job="hhy-backend-r12"} == 0
        for: 15s
        labels: { severity: critical, release: R12 }
        annotations: { summary: 合伙云 R12 Staging 后端不可用 }
      - alert: HhyR12HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="hhy-backend-r12",status=~"5.."}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="hhy-backend-r12"}[1m])), 0.001) > 0.02
        for: 1m
        labels: { severity: warning, release: R12 }
        annotations: { summary: 合伙云 R12 Staging 5xx 比例超过 2% }
      - alert: HhyR12HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="hhy-backend-r12"}[5m]))) > 0.5
        for: 2m
        labels: { severity: warning, release: R12 }
        annotations: { summary: 合伙云 R12 Staging P95 延迟超过 500ms }
      - alert: HhyR12OutboxBacklog
        expr: hhy_r12_outbox_backlog{job="hhy-backend-r12"} > 3
        for: 15s
        labels: { severity: warning, release: R12 }
        annotations: { summary: R12 发布与审核事件 Outbox 积压超过 3 条 }
      - alert: HhyR12ReviewBacklog
        expr: hhy_publish_review_pending{job="hhy-backend-r12"} > 100
        for: 5m
        labels: { severity: warning, release: R12 }
        annotations: { summary: R12 待审核内容超过 100 条 }
      - alert: HhyR12RejectedBacklog
        expr: hhy_publish_rejected_count{job="hhy-backend-r12"} > 100
        for: 5m
        labels: { severity: warning, release: R12 }
        annotations: { summary: R12 待整改驳回内容超过 100 条 }
      - alert: HhyR12BusinessMetricQueryFailure
        expr: sum(hhy_business_metric_query_failures_total{job="hhy-backend-r12",metric=~"hhy\\.(publish|r12)\\..*"}) > 0
        for: 15s
        labels: { severity: critical, release: R12 }
        annotations: { summary: R12 业务指标查询失败，监控结果不可信 }
