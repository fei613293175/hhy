  user_request: 项目所有者要求解决服务器连接限流并把经验写入可跨电脑跨AI复用记录。
  reason: R10固定签名APK交付期间公网扫描占用默认MaxStartups预认证槽，导致SCP随机reset；已通过缩短LoginGraceTime、适度提高MaxStartups和连续12连接验证解决，并需固化R10交付证据。
