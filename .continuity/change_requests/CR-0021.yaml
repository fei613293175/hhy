protocol_version: '1.0'
cr_id: CR-0021
title: 将1主控加3执行代理设为跨AI跨设备默认自动并行规则
status: IMPLEMENTED
created_at: '2026-07-17T22:16:06Z'
updated_at: '2026-07-17T23:07:15Z'
