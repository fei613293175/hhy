title: 消除UI施工歧义并分离机器收尾与生产验收门禁
status: CLOSED
created_at: '2026-07-22T15:41:18Z'
updated_at: '2026-07-22T15:56:57Z'
requester_actor_id: codex-root-r09-ui-audit
