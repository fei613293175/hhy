  migration_and_compatibility: 无数据库、后端API、配置或版本号变化。新增Android模块和类型安全路由；orderNo完全遵循OpenAPI非空/最大128并进行单路径段一次编码。401沿用应用会话失效流程并保留合法原目标，403/404不清会话且使用同级不可用语义。SCR-ORDER-001尚未上线时非法路由popBackStack、栈空回现有Home；STORY-R16-003上线后把回退目标无损切到Orders列表，OrderDetail路由不变。
user_confirmation: 项目所有者已明确要求持续推进R16，按冻结开发文档实现真实前后端对应能力，并禁止虚构参考图中的内容或功能。
approval:
  decision: APPROVED
  decided_at: '2026-07-28T13:21:48Z'
  note: 独立复审确认：SCR-ORDER-002仅调用冻结的orderGetMeOrdersByOrderno只读GET合同并完整解码OrderResource；orderNo遵循1至128字符合同宽度，对空格、中文和保留字符执行单路径段一次UTF-8百分号编码且拒绝空值/超长/注入/双重编码；历史未记录严格限定为confirmed=false、空agreementVersion、null
    confirmedAt三字段组合，普通未确认和已确认不混淆；8个状态全部中文化且未知值不泄露原枚举，userId/version/requestId/ruleVersions均有UI负断言；支付、退款、客服、物流、发票和再次购买全部禁止；401保留合法原目标并使会话失效，403/404不清会话且不泄露存在性；列表上线前使用现有栈pop或已登记Home，后续仅替换回退目标而保持OrderDetail路由；测试覆盖网络、状态、路由、模块编译与Lint。
