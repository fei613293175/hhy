user_request: 持续推进R16，完成真实前后端对应能力并在大版本完成时统一交付APK与测试文档
reason: R16后端已冻结并实现用户订单详情接口，但Android尚无feature:order、类型安全客户端或SCR-ORDER-002路由页面
original_rule: SCR-ORDER-002规格和orderGetMeOrdersByOrderno合同已冻结，但Android没有订单网络模型、feature:order模块、类型安全路由或详情页面。OpenAPI的orderNo仅要求非空且最长128字符，不存在客户端字符白名单。V045历史订单仅以confirmed=false、agreementVersion空字符串、confirmedAt=null三字段组合标识未记录。
new_rule: 新增feature:order并只实现SCR-ORDER-002只读详情。网络客户端严格GET /api/v1/me/orders/{orderNo}并解码冻结OrderResource；orderNo接受合同允许的1至128字符（含空格、中文和保留字符），只对单一路径段做一次UTF-8百分号编码，拒绝空值/超长并禁止路径注入和双重编码。页面固定56dp顶栏、16dp页边距/卡片内边距，展示状态摘要、订单项、原价/优惠/服务费/应付/实付、不退款证据和真实时间。仅confirmed=false且agreementVersion为空且confirmedAt=null显示历史订单未记录；confirmed=true显示已确认；confirmed=false但存在协议版本或确认时间显示尚未确认，绝不误标历史或已确认。8个冻结状态全部中文化，未知值统一显示订单状态待确认且不暴露原值。普通界面不得显示userId、version、requestId、ruleVersions或技术枚举。禁止支付、退款、客服、物流、发票和再次购买。401触发现有会话失效并以合法OrderDetail目标返回登录；403/404只显示不可用状态，不清会话且文案不区分越权与资源存在性。SCR-ORDER-001上线前，非法/缺失orderNo先popBackStack，栈空仅回已登记Home；列表上线后无损改为Orders模块首页。
impact_summary: 新增R16订单类型安全网络合同和feature:order模块，将OrderDetail(orderNo)接入应用导航，覆盖合同宽度路径编码、完整资源解码、401返回目标、状态恢复、8状态中文化、精确历史证据语义、隐藏技术字段与禁止虚构动作，并更新R16实施证据。
