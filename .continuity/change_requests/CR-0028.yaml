user_request: 项目所有者要求立即完成R02并进入下一版本，不允许无限做不完。
reason: R02 Android注册必须从受控来源读取有效协议版本；现有R28冻结契约已定义只读注册配置，复用该契约比新增临时接口风险更低。
original_rule: 注册协议版本读取接口实现归属R28；R02 Android注册页只能手工输入版本ID，无法从受控来源完成真实注册。
new_rule: R02可提前实现既有冻结且只读的GET /public-api/v1/invite/{code}/registration-config，供Android读取邀请码状态与当前生效协议版本；不新增接口、不修改R28契约、不写入协议或伪造版本。
impact_summary: 解除R02 Android注册的客户端手输协议版本缺口，使客户端只提交服务端返回的生效版本ID；协议内容、版本创建和后台管理仍归R28。
