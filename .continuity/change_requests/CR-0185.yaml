user_request: 项目所有者要求彻底解决PowerShell频繁缺少Git PATH，并写入踩坑记录和经验复用记录。
reason: 项目脚本虽已能解析HHY_GIT_BIN和Codex捆绑Git，但Windows用户级PATH与HHY_GIT_BIN从未持久化，导致裸git及Python子进程在每个新执行环境重复失败和临时注入。
original_rule: Windows脚本可自行回退到受控Git，但用户环境未持久化，裸git和第三方子进程仍会频繁报PATH缺失；换电脑只能依赖聊天经验手工注入。
new_rule: Windows接手项目时必须一次运行仓库Git运行时配置脚本：优先验证显式HHY_GIT_BIN，其次系统Git，最后Codex受控运行时；把可执行文件写入用户级HHY_GIT_BIN并把其cmd目录幂等加入用户PATH，支持check回读。项目命令仍优先使用HHY_GIT_BIN或hhy_workflow入口，不因当前宿主进程未刷新而重复诊断。换电脑按START_HERE执行同一脚本。
impact_summary: 新增可复用Windows Git环境配置脚本和机器可读传输恢复入口，补全START_HERE、统一开发规范、踩坑与Problem Registry；当前电脑用户环境同步完成。
