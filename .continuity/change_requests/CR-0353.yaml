user_request: 全局检查开发文档、硬性门禁、开发进度、优点复用和踩坑记录；存在漂移立即加固优化。
reason: R12候选修复容器已部署健康，但api.orbexa.cc反向代理仍指向旧端口，公网bootstrap连续命中旧镜像；现有门禁缺少目标容器到公网路由的端到端命中证明，且启动码检查位于Android工具链安装之后造成无效耗时。
original_rule: 候选后端部署只要求容器健康和公网状态200；启动码请求在Java、Android SDK、KVM准备之后执行，curl失败只返回笼统HTTP状态。
new_rule: 候选切流必须通过唯一受控脚本完成：精确验证旧/新upstream、目标容器端口与本机健康，备份Nginx配置后切换，nginx -t成功才reload，并以唯一X-Request-ID从公网访问后证明请求命中目标容器；任一步失败自动回滚。GitHub必须在安装Java、Android
  SDK和KVM之前分别验证OIDC与Staging bootstrap并输出不含令牌/响应体的阶段化HTTP状态。未取得端到端命中证据禁止候选。
impact_summary: 原位加固既有Android自动候选和固定远程环境规则，新增受控可回滚路由脚本及静态回归，前置启动码门禁减少错误路由时的无效Android准备；不修改产品页面、业务API、数据库、资金规则或全局候选次数。
