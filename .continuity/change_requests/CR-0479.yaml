impact_summary: 阻断R14及后续复用路由时误接旧版本网络/数据库或只读MFA卷；记录Attempt3 HTTP500/JwtException和现场纠正证据，递增一次性Attempt4；不改变产品UI、公开API、业务数据库结构或生产数据
