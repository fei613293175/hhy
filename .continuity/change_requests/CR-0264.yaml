original_rule: R10开发包已生成DoR、Stories、Tasks和Manifest；SCR-LIST-003绑定B02/P01-P08，SCR-DETAIL-003绑定B03/P01-P07，但SCR-PUB-004仅绑定TOKENS_ONLY/-，且R10尚无入口报告、版本执行计划或依赖机器完成投影。
