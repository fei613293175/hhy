  - PostgreSQL 17 R16真实存储：读写权限、用户列表与详情双重owner隔离并统一404、查询上限拒绝
  - 管理员幂等scope边界：最长operationId、64字符resourceKey、Long.MAX_VALUE管理员ID仍小于64字符，并覆盖稳定重放及跨管理员/操作/资源隔离
