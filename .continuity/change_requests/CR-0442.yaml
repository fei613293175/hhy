  migration_and_compatibility: 前向追加V046，仅新增权限数据和角色映射，不改变表结构或既有product.manage。已有粗粒度角色无缝获得read/write，SUPER_ADMIN兜底获得；新角色可独立授予。U046仅DEV/TEST使用，发现不具product.manage的非SUPER_ADMIN角色独立使用细粒度权限即拒绝；安全状态可回滚重放。应用要求数据库至少V046。固定长度scope兼容V014的varchar(128)且自身保持小于64字符。历史订单只读兼容且不补造；部署回滚保留合法业务事实。
user_confirmation: 项目所有者已明确要求持续推进全部版本且以后无需逐次批准；本CR属于TASK-R16-003既定后端范围
