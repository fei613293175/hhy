user_request: 持续推进合伙云Pro开发；R16数据不变量完成后立即实现10个冻结operationId，不重复处理邀请码问题
reason: R16数据库合同已经落地，但commerce模块尚无Product、ProductSku、Order应用服务、PostgreSQL存储、用户及后台控制器，10个冻结operationId均没有真实实现
original_rule: R16已冻结10个operationId与显式ProductResource、ProductSkuResource、OrderResource合同，V045提供真实表结构和不变量；但commerce模块尚无R16应用链，数据库RBAC仍只有product.manage，与OpenAPI
  product.read/product.write不一致。
new_rule: 新增前向V046且不改写旧迁移：创建product.read和product.write，所有已有product.manage角色安全映射到两个细粒度权限，ACTIVE SUPER_ADMIN必得两项；权限不完整原子失败。DEV/TEST回滚只在不存在脱离product.manage的独立细粒度授权时删除V046映射和权限，否则原子拒绝。完整实现10个冻结operationId且不改变OpenAPI。用户订单列表和详情均在SQL层按认证userId绑定owner；跨用户与不存在订单统一COMMON-404-NOT_FOUND。后台商品/SKU读写强制product.read/product.write，后台订单强制order.read。控制器只做HTTP映射、Bean
  Validation、身份、requestId/IP和ApiResponse编排。商品与SKU状态保持非空受限string，不臆造枚举；查询只允许冻结字段和白名单排序，cursor严格解码并绑定排序。后台写幂等由Boot中性SnapshotCodec适配AdminIdempotencySnapshotCipher，commerce不得依赖access。scope使用r16adm:<Base64URL(SHA-256(length-prefix(adminId,operationId,resourceKey)))>固定确定性编码，始终小于64字符；create资源键为productCode或skuCode，patch为不可变id。规范请求SHA-256覆盖HTTP方法、规范路径、管理员、operationId、资源键和完整请求体。同scope/key/hash重放加密首次响应，同键异哈希409；篡改密文拒绝，密钥轮换可用previous
  key解密。PATCH expectedVersion原子乐观锁且零字段补丁拒绝；productCode、skuCode和SKU productId不可变。SKU权益严格为BenefitResource；金额非负，durationDays为null或正数，销售窗口有序，分佣各级及合计不超10000；commissionEnabled=false只允许空或零费率并落零。创建SKU事务先FOR
  UPDATE锁商品并计数，已有100个即422，因此并发也不得超100。商品/SKU业务写、admin_operation_logs、Outbox、幂等领取和首次响应快照均在同一数据库事务；任一点失败全部回滚，重放不重复审计/事件。订单由orders/items/唯一price
  snapshot构造，超过100项、商品超过100 SKU、重复/缺失快照或非法JSON均拒绝，禁止截断/补造。历史confirmed=false且协议版本为空时输出空字符串满足冻结必填字段，confirmed仍为false且confirmedAt为空。
impact_summary: 新增V046 RBAC对齐、运行时副本、DEV回滚和权限测试；新增R16 commerce合同、服务、PostgreSQL存储、管理员密文适配与用户/后台控制器，覆盖10个operationId。专项验证固定长度幂等scope、细粒度权限、跨管理员隔离和轮换、事务故障原子性、PATCH并发、SKU
  100上限、订单owner统一404与合同上限。复用V045及既有事实表，不触碰邀请码注册链。
