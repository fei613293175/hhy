  decided_at: '2026-07-28T13:49:55Z'
  note: 独立计划审查拒绝：大版本machine completion改为对应release交互候选PASS、owner异步反馈不阻塞下一版且仅production activation/production-close继续要求owner PASS的方向正确，补齐既有规则投影文件也正确；但当前API清单把冻结的POST/DELETE
    /api/v1/users/{id}/block误写成/api/v1/blocks/{peerId}，必须纠正并明确六项缺陷不改公共OpenAPI和生产数据库结构。拉黑状态需冻结具体持久化机制与一致性边界：若用SharedPreferences须声明为同安装设备成功操作缓存、按currentUserId+peerId隔离、失败不写、切换账号不串、进程重建可恢复，并测试block/unblock失败与多用户多peer；若用DataStore或MainActivity注入须补build.gradle/版本目录/MainActivity影响文件。候选夹具需冻结每轮按release+commit+runId确定性清理并重建R14会话、消息、block状态，证明连续两次bootstrap/候选起点一致且production硬拒绝；旅程需明确null
    readAt不得显示已读、重进后解除拉黑、搜索普通词及字面%/_/反斜杠、列表长按删除且详情无删除、下一轮恢复。测试还须明确readAt缺失/null/有效时间三态、PostgreSQL17真实集成、系统栏不重叠与列表/详情顶栏等高，以及候选逐步断言、日志、截图身份/SHA和报告，截图不得代替业务断言。完成amend后重新独立审批。
