user_request: R14消息存在已读状态、系统栏重叠、拉黑状态丢失、删除入口错误、消息页头高度不统一、搜索失败六项缺陷；每个Android大版本结束必须由AI在GitHub Actions模拟器逐项点击操作审核，不能只看截图。
reason: R14当前候选不满足真实功能与视觉验收；既有全局条款将GitHub模拟器定义为按需，需在原条款内升级为大版本结束强制交互候选且不增加普通提交负担。
original_rule: CR-0412与CR-0414把GitHub模拟器候选降为按需非阻断专项，机器关闭可仅凭固定工具链TEST_APK推进；R14消息页各自维护顶栏、拉黑状态和删除入口，候选旅程仍硬编码R13。
new_rule: R06至R32每个Android大版本最终机器关闭前必须运行一次绑定该版本冻结Commit的GitHub Actions交互候选：AI使用UiAutomator/Compose逐项点击、输入、长按、返回并核对业务状态、日志和截图，截图只能作为视觉证据而不能替代功能操作；普通提交、小版本和中间开发不得触发重型候选；AI独立判定PASS/FAIL，项目所有者真机反馈保持异步且不阻塞下一版本开发，生产激活仍保留项目所有者验收。R14必须补做并通过该验收后才恢复R16扩展。
impact_summary: 原位修订CR-0412/CR-0414投影而不另建平行规则；机器关闭恢复要求大版本专属交互候选PASS，但TEST_APK仍可先交付且普通提交不跑模拟器。修复readAt JSON null假已读、统一Material TopAppBar与Insets、本人拉黑状态重进持久化及解除文案、删除迁至列表长按、PostgreSQL关键词搜索；建立R14
  staging可重复夹具与发送/拉黑/重进/解除/搜索/长按删除真实旅程。
