  migration_and_compatibility: 不修改生产数据库结构。搜索SQL仅修正PostgreSQL单字符ESCAPE；本人拉黑缓存按登录用户和对端用户隔离，只在服务端block/unblock成功后变化，不把对方拉黑误判为本人可解除；候选夹具仅在staging
    CI自动化开关下事务准备并在每轮恢复确定状态；既有R06-R13历史证据不改写，R13旅程保留并按release分派。TEST_APK仍可在固定工具链PASS后先交付并继续非冲突开发，但大版本machine completion在对应GitHub交互候选PASS前不得宣称完成；production-close继续要求owner验收。
