user_request: 持续开发且所有功能一比一对应开发文档和冻结合同，不得出现实现漂移
reason: TASK-R16-003真实实现核对发现OpenAPI BenefitResource.name最大255、unit最大64且durationDays允许0，但V045函数仅允许120/32且数据库只允许正数，应用服务也沿用了较窄边界，合法冻结请求会被错误拒绝
original_rule: 冻结OpenAPI允许BenefitResource.name最长255、unit最长64且durationDays最小0；V045和当前应用却分别限制120、32和正数，导致合同允许但数据库或服务拒绝。
new_rule: 只追加V047且不改写V045：原子重建hhy.r16_benefits_valid，使name为1至255、unit最大64并保留对象键、必填字段、100项上限；将ck_r16_product_skus_duration改为duration_days为null或大于等于0。应用服务同步接受同一边界。DEV回滚在存在name超过120、unit超过32或duration_days=0时原子拒绝，安全数据下恢复V045边界。合同对齐测试必须证明255/64/0接受，256/65/负数拒绝，非法JSON和多余字段仍拒绝，source/runtime迁移字节一致。
impact_summary: 新增V047、运行时副本、DEV回滚和真实PostgreSQL属性测试；收敛R16CommerceService边界及专项静态和Java测试，不改变OpenAPI、既有事实数据或邀请码链。
