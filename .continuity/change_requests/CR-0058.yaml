original_rule: H5邀请注册要求用户手动获取安全验证、发送注册短信、输入短信码并提交协议版本。
new_rule: H5注册以手机号、密码、确认密码和URL邀请码为可见注册字段；点击注册后自动弹出安全验证，验证并继续直接提交注册；不发送注册短信、不提交协议版本、不展示技术提示。
