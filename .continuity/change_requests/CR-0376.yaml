session_id: SES-20260726T182231Z-EE79FA49
user_request: 项目所有者批准持续开发并要求可复用经验写入仓库事实源，常规开发决策不再逐次确认。
reason: 既有.gitattributes仅对artifacts/validation/**设置-text，能保留原始字节但仍按文本diff检查；Prometheus和HTTP原始协议证据含合法尾空格，新增文件会被git diff --check误拒绝，删除空格又会破坏远端本地SHA-256一致性。
original_rule: artifacts/validation/**仅设置-text保留原始字节，Git仍对新增Prometheus/HTTP协议证据执行文本空白差异检查。
new_rule: 在同一既有.gitattributes规则上追加-diff：现场验证证据继续逐字节冻结并参与SHA-256、Secret和Scope门禁，但不按源代码文本执行尾空格或行尾差异检查。
impact_summary: 原位更新一条既有Git属性规则，解决原始协议证据与源码空白门禁冲突；不修改任何证据字节、业务代码、测试结果或运行时。
impact:
  files:
  - .gitattributes
  pages: []
  apis: []
  database: []
  configuration: []
  ledger: []
  tests:
  - git check-attr diff;git diff --cached --check;remote-local SHA256 verification
  releases:
  - R13
  migration_and_compatibility: Git属性仅影响后续diff展示和diff --check；已跟踪及新增证据原始字节、SHA-256和跨机器复核保持不变。
user_confirmation: 批准，以后不要让我批准了 你自己持续开发就行了
approval:
  decision: APPROVED
  decided_at: '2026-07-26T19:02:16Z'
  note: 批准原位强化既有证据Git属性；只消除原始协议字节的文本空白误报，不削弱证据哈希、Secret、Scope或连续性门禁。
