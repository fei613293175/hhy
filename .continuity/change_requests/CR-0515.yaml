  configuration:
  - owner-test机器事实、候选后恢复证明和当前R14持久后端身份
  ledger:
  - 不修改资金与账本事实
  tests:
  - 静态配置门禁、脚本策略测试、服务器容器/卷/路由/健康/邀请码/密码哈希匹配实证
