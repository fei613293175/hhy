reason: Attempt19的App级ReleaseCandidateSmokeTest完整通过并生成四图；根Gradle任务connectedDebugAndroidTest随后把App测试类过滤条件错误套到feature:chat，因测试类不在该模块而ClassNotFoundException。必须把候选任务限定为:app:connectedDebugAndroidTest并增加静态回归。
original_rule: 候选脚本从Android根工程执行未限定模块的connectedDebugAndroidTest，同时传入只存在于app模块的ReleaseCandidateSmokeTest类过滤条件。
new_rule: 候选脚本必须只执行:app:connectedDebugAndroidTest；测试必须断言精确模块任务存在且禁止恢复未限定模块的connectedDebugAndroidTest，避免类过滤条件传播到Library模块。
impact_summary: 只收窄GitHub模拟器候选的Gradle任务范围到App模块；不修改App产品代码、功能验收、截图、API、数据库或其他模块自己的测试。
