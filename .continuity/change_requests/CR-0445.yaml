  decided_at: '2026-07-28T11:59:01Z'
  note: 独立审查确认变更仅作用于src/test/resources默认test profile：UUID内存库隔离不同ApplicationContext，同时保留MODE=PostgreSQL与DB_CLOSE_DELAY=-1；Spring高优先级显式spring.datasource.url继续覆盖默认值，生产配置与运行时代码不受影响，完整后端回归范围足够。
