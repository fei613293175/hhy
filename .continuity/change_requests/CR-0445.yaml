user_request: 持续推进R16开发并完成真实回归，不因既有测试基础设施污染停止
reason: 完整回归确认多个不同Spring测试上下文复用jdbc:h2:mem:hhy且DB_CLOSE_DELAY=-1，schema.sql在后续上下文重复建表，造成PublicEndpointsTest等8项级联错误；生产PostgreSQL与显式测试URL不受影响
original_rule: application-test.yml固定使用jdbc:h2:mem:hhy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1，不同Spring上下文共享同一JVM内存库并重复执行schema.sql。
new_rule: 默认test profile的H2数据库名必须包含Spring RandomValuePropertySource生成的UUID，使每个独立ApplicationContext拥有隔离数据库；同一缓存上下文保持同一URL；测试显式声明的spring.datasource.url继续优先且不变。
impact_summary: 仅修改统一测试配置中的默认H2 URL，从固定hhy改为hhy-${random.uuid}，消除上下文间重复建表和状态串扰。
impact:
  files:
  - services/backend/boot/src/test/resources/application-test.yml
  pages: []
  apis: []
  database: []
  configuration:
  - spring.datasource.url
  ledger: []
  tests:
  - 完整mvn -pl boot -am test须491项0失败0错误；PublicEndpointsTest及其他默认test profile上下文不得再出现APP_BUILD_ARTIFACTS already exists。
  releases:
  - R16
  migration_and_compatibility: 无生产配置、数据库迁移、API或运行时代码变化。所有显式声明测试数据库URL的测试保持原行为；默认测试上下文仍使用H2 PostgreSQL兼容模式和DB_CLOSE_DELAY=-1，但隔离到各自UUID数据库。
user_confirmation: 项目所有者已明确要求持续推进R16并完成真实回归，本变更仅修复测试上下文数据库污染。
approval:
