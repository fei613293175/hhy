    PENDING本身不阻断，不能单独授权跨Release，必须与同Release同Commit交互候选报告PASS、machine_completion.status=PASS及TEST_APK身份闭环组合通过，并由continuity继续校验TASK全DONE和连续编号。测试覆盖R13兼容、R14候选/机器完成缺失失败、完整组合通过及错误文案不再宣称TEST_APK单独放行，范围完整。批准实施。
