user_request: 持续推进R14并严格按照开发文档和效果图实现所有前端页面
reason: STORY-R14-002要求SCR-CHAT-001真实会话列表；当前Android未实现chatGetConversations，会话底栏仍禁用且没有进入已完成ChatDetail的列表入口
original_rule: SCR-CHAT-001已冻结B07/P01视觉与chatGetConversations合同，但Android没有会话列表页面、列表状态机或可操作的消息底栏入口
new_rule: 以B07/P01为SCR-CHAT-001唯一视觉权威，只保留消息标题、搜索、真实会话行、最后消息时间和未读；过滤示例用户、通知公告客服系统快捷区、虚构角标和未登记新增按钮。ContractR14Api严格解码ConversationResource与分页，搜索最多100字符，分页按conversationId去重并保留刷新和翻页局部失败。新增类型安全Messages顶层路由并启用现有消息底栏；列表行仅在合法conversationId及真实peer存在时进入既有ChatDetail，返回列表后按服务端刷新。UI不得显示资源ID、version、lastReadMessageId、requestId或任意技术字段
impact_summary: 扩展R14网络合同和chat模块会话列表状态与页面；App增加Messages顶层路由并连接ChatDetail；Shell只开放已实现的MESSAGE底栏并通过注入内容复用同一底栏，不引入R15通知公告消息中心
