  decided_at: '2026-07-27T23:31:13Z'
  note: 独立计划审查拒绝：B07/P01精确视觉、真实会话字段、MESSAGE底栏和R15通知公告隔离方向正确，但SCR-CHAT-001合同与测试仍不完整。必须把CONNECTING与SYNCING纳入状态机和重连、乱序、重复消息合并证据；补冻结GET合同的400与404映射，并覆盖相同查询去重、搜索变化取消旧请求、瞬断最多自动重试2次及旧响应不得覆盖新关键词。分页合并必须保持服务端顺序，不得以本地规则发明排序。视觉施工须明确复用design/tokens/hhy_design_tokens_v1.2.2.json与HhyTokens，保留标题、搜索、真实会话行、时间、真实unreadCount及底部消息栏目层级，仅过滤虚构红点和R15快捷区。导航测试须补Messages底栏选中态和各栏目状态保存恢复、ChatDetail返回Messages来源栈、顶栏/系统/手势返回同源。P05/P06及通知、公告、客服、系统快捷区继续严格留在R15。完成amend后再审。
