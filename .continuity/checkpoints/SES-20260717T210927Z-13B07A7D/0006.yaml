parallel_execution:
  assessment: DELEGATED
  delegated_workers: 3
  workers:
  - worker_id: program-policy
    responsibility: 总计划生成与严格校验
    allowed_paths:
    - scripts/generate_program_execution_plan.py
    - scripts/check_program_execution_plan.py
    - tests/test_program_execution_plan.py
  - worker_id: parallel-guard
    responsibility: 并行worktree容量与路径门禁
    allowed_paths:
    - scripts/prepare_parallel_worktrees.ps1
    - tests/test_parallel_worktrees.py
  - worker_id: context-recovery
    responsibility: 跨AI跨设备Context恢复回归
    allowed_paths:
    - scripts/run_continuity_self_test.py
    - tests/test_context_pack_parallel_policy.py
  reason: 3个代理被实际委托但均因外部服务余额不足返回403；主控按规则串行复核并完成所有补丁、测试和集成。
