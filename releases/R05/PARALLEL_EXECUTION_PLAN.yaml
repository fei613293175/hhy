version: '1.0'
release: R05
change_request: CR-0019
mode: ONE_MASTER_THREE_DELEGATED_WORKERS
authoritative_session_count: 1
max_parallel_workers: 3
simultaneous_claim_limit: 1
worker_parallelism_scope: WITHIN_ACTIVE_TASK_ONLY
default_delegation_mode: AUTO_WHEN_SAFE_PARALLEL_WORK_EXISTS
review_triggers: [TASK_START, SCOPE_CHANGE]
per_task_user_confirmation_required: false
non_delegation_requires_checkpoint_reason: true
capability_fallback: RECORD_LIMITATION_AND_DO_NOT_FABRICATE_PARALLEL_EVIDENCE
user_override_allowed: true
source_of_truth_branch: task/TASK-R03-001
rules:
- 主控一次只领取一个Task/Story；执行代理只允许在当前Claim内部按互斥路径工作，未来Task只能做只读准备。
- 执行代理不得修改连续性、Release状态、公共契约、共享生成类型、Flyway编号或APK身份，也不得提交、推送、合并或发布。
- 主控先冻结实名认证状态机、供应商端口、数据加密与私有媒体边界，再集成后端、Android、H5、Admin和质量证据。
- 姓名、身份证、人脸照片、供应商响应和SecretRef按最高敏感级别处理，任何日志和报告不得包含明文。
- APK机器交付与项目所有者真机验收是两个独立门禁；外部供应商未激活不得伪造通过。
worker_partitions:
- partition: BACKEND_DATA
  allowed_paths:
  - services/backend/**
  - database/**
  forbidden_shared_paths:
  - services/backend/boot/src/main/resources/contracts/**
  - services/backend/boot/src/main/resources/db/migration/**
- partition: CLIENT_SURFACES
  allowed_paths:
  - apps/android/feature/identity/**
  - apps/admin-web/**
  - apps/h5/**
  forbidden_shared_paths:
  - apps/android/app/**
  - apps/android/core/network/**
  - apps/admin-web/src/router.ts
  - apps/admin-web/src/App.vue
- partition: QUALITY_EVIDENCE
  allowed_paths:
  - tests/r05/**
  - artifacts/validation/r05-*/**
  forbidden_shared_paths: []
coordinator_owned_paths:
- .continuity/**
- CURRENT_STATUS.yaml
- NEXT_TASK.yaml
- releases/**
- contracts/**
- packages/api-client/**
- catalogs/**
- docs/03-continuity/**
- apps/android/app/**
- apps/android/core/network/**
- services/backend/boot/src/main/resources/db/migration/**
lanes:
- lane: IDENTITY-FOUNDATION
  task_id: TASK-R05-003
  stories:
  - STORY-R05-008
  outcome: V028数据不变量、实名认证状态机、供应商端口、加密私有证据、幂等、审计和九项API闭环
  preferred_agents:
  - backend_data_high_reasoning
  - quality
- lane: ADMIN-IDENTITY
  task_id: TASK-R05-004
  stories:
  - STORY-R05-001
  - STORY-R05-002
  outcome: 实名列表、详情、敏感媒体授权、人工复核、双人冻结和审计闭环
  preferred_agents:
  - admin_client
  - backend_data
  - quality
- lane: ANDROID-IDENTITY
  task_id: TASK-R05-004
  stories:
  - STORY-R05-003
  - STORY-R05-004
  - STORY-R05-005
  - STORY-R05-006
  outcome: 实名首页、身份信息、活体容器、结果与重试的Android可见闭环
  preferred_agents:
  - android_client
  - quality
- lane: H5-LIVENESS-CALLBACK
  task_id: TASK-R05-004
  stories:
  - STORY-R05-007
  outcome: 活体回跳消费、App轮询通知、安全导航和错误恢复闭环
  preferred_agents:
  - web_frontend
  - backend_data
  - quality
integration:
  task_id: TASK-R05-005
  depends_on:
  - TASK-R05-003
  - TASK-R05-004
  profiles:
  - MODULE
  - INTEGRATION
  - SECURITY
staging:
  task_id: TASK-R05-006
  required_evidence:
  - structured_logs_and_trace
  - red_and_business_metrics
  - alerts_firing_and_resolved
  - same_database_volume_rollback
apk:
  task_id: TASK-R05-007
  desktop_copy_required: true
  public_download_required: true
  stable_test_signing_required: true
  minimum_version_code: 10208
  owner_physical_test_initial_status: PENDING
