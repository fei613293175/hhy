  deliverables:
  - Flyway空库、升级库、回滚和不变量证据
  - R2/OSS合同测试、Scope隔离、私有URL TTL、迁移游标恢复证据
  - 供应商超时、重试和恢复测试
  acceptance:
  - 无TODO/生产Mock或跨Scope数据泄漏
  - 私有预览、迁移和审计不需要新增冻结外部API；若需要则先走CR
  - MODULE门禁通过
  session_log_required: true
- id: TASK-R04-003
