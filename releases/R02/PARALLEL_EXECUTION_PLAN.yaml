  depends_on:
  - TASK-R02-002
  - TASK-R02-003
  - TASK-R02-004
  - TASK-R02-005
  cadence: 每日一次或四个纵向批次任一汇合时
  profiles:
  - INTEGRATION
  - RELEASE
