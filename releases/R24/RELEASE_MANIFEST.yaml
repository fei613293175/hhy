- TST-ACCOUNTING_OPS_001-DRIFT
- TST-ACCOUNTING_OPS_001-HAPPY
- TST-ACCOUNTING_OPS_001-REJECT
- TST-ACCOUNTING_OPS_001-SECURITY
- TST-REWARD_001-CONCURRENCY
- TST-REWARD_001-HAPPY
- TST-REWARD_001-IDEMPOTENT
- TST-REWARD_001-RECOVERY
- TST-REWARD_001-REJECT
- TST-V122-039
- TST-V122-040
- TST-V122-041
- TST-V122-042
- TST-WD_001-CONCURRENCY
- TST-WD_001-HAPPY
- TST-WD_001-IDEMPOTENT
- TST-WD_001-RECOVERY
- TST-WD_001-REJECT
entry_gate:
- releases/R24/DEFINITION_OF_READY.yaml 全部适用项为PASS
- releases/R24/STORIES.yaml 中每个故事均绑定页面/API/配置/数据/测试或显式N/A
- 本版本页面字段、状态、动作、导航和后台运营规格不存在TBD/RELEASE_BOUND
- 全部依赖版本为GREEN或按发布计划允许的并行依赖已记录
- 冻结契约发生变化时已创建CR并重新生成追踪和SHA
exit_gate:
- 领域代码与前端真实闭环
- 数据库迁移和不变量测试通过
- 契约/单元/集成/E2E/安全专项测试通过
- 日志指标链路和业务告警可验证
- Session Log、追踪矩阵、产物Manifest和下一任务更新
- Staging APK可安装且SHA256、Commit、版本信息完整
change_policy: V1.2.2 页面、字段、状态、动作、API、配置和数据目录是唯一事实源；破坏性变更必须CR+版本升级+迁移+消费者兼容窗口
documentation_baseline: V1.2.2
document_gap_status: ZERO_BLOCKING_DOCUMENT_GAPS
definition_of_ready: releases/R24/DEFINITION_OF_READY.yaml
story_backlog: releases/R24/STORIES.yaml
continuity:
  policy: .continuity/CONTINUITY_POLICY.yaml
  protocol_version: '1.0'
  mode: ENFORCED
  session_required_before_change: true
  checkpoint_required_before_commit: true
  old_conversation_required: false
  handoff_bundle_required_for_actor_switch: true
