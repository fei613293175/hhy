  refinement_trigger: 每个版本封板时把当前+1提升为EXECUTION_READY，并把当前+3提升为STORY_READY
  rules:
  - 当前版本细化到代理、目录、接口、页面、数据和测试
  - 后两个版本细化到纵向Story、依赖、外部资源和验收
  - 其余版本保持里程碑、DAG、规模、风险和最晚外部准备版本
  - 滚动细化不得改变冻结业务事实；需要改变时必须新建CR
