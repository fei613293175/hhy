operating_model:
  actual_concurrency_slots: 4
  coordinator_slots: 1
  delegated_worker_slots: 3
  authoritative_session_count: 1
  default_delegation_mode: AUTO_WHEN_SAFE_PARALLEL_WORK_EXISTS
  review_triggers:
  - TASK_START
  - SCOPE_CHANGE
  per_task_user_confirmation_required: false
  non_delegation_requires_checkpoint_reason: true
  capability_fallback: RECORD_LIMITATION_AND_DO_NOT_FABRICATE_PARALLEL_EVIDENCE
  user_override_allowed: true
  simultaneous_business_release_limit: 1
  cross_release_parallelism: PLANNING_AND_EXTERNAL_PREPARATION_ONLY
  worker_rules:
  - 每个执行代理使用隔离scratch worktree和互不重叠的路径租约
  - 执行代理不修改连续性和Release事实，不提交、不推送、不发布
  - 主控逐项审查补丁、运行门禁并作为唯一提交者
  - 资金、状态机、并发、安全和破坏性迁移由高推理主控复核
  default_partitions:
  - id: BACKEND_DATA
    paths:
    - services/backend/**
    - database/**
  - id: CLIENT
    paths:
    - apps/android/**
    - apps/admin-web/**
    - apps/h5/**
    rule: 每次任务只领取实际涉及的客户端目录
  - id: QUALITY_DELIVERY
    paths:
    - tests/**
    - artifacts/validation/**
