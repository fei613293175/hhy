release: R19
title: 道具与曝光层级
status: READY_WHEN_DEPENDENCIES_GREEN
milestone: M2_COMMERCE
depends_on:
- R17
- R12
scope: 刷新、置顶、头条、变色、24小时权益、叠加、排期、自动执行和统计
android_test_apk_required: true
requirements:
- REQ-PROP-001
- REQ-PROP-002
ui:
  android:
  - SCR-PROP-001
  - SCR-PROP-002
  - SCR-PROP-003
  h5: []
  admin:
  - ADM-PROP-001
  - ADM-PROP-002
  - ADM-PROP-003
contracts:
  client_api:
  - GET /api/v1/props/store
  - GET /api/v1/me/props
  - POST /api/v1/props/orders
  - POST /api/v1/me/props/{id}/use
  admin_api:
  - GET /admin-api/v1/props
  - PATCH /admin-api/v1/props/{id}
  - GET /admin-api/v1/headline-slots
  - POST /admin-api/v1/headline-slots
  - GET /admin-api/v1/prop-executions
  websocket: []
database_tables:
- prop_products
- prop_skus
- user_props
- content_exposure_entitlements
- content_refresh_records
- headline_slot_bookings
- prop_execution_logs
- system_configs
tests:
- TST-PROP_001-HAPPY
- TST-PROP_001-IDEMPOTENT
- TST-PROP_001-REJECT
- TST-PROP_002-HAPPY
- TST-PROP_002-IDEMPOTENT
- TST-PROP_002-REJECT
entry_gate:
- releases/R19/DEFINITION_OF_READY.yaml 全部适用项为PASS
- releases/R19/STORIES.yaml 中每个故事均绑定页面/API/配置/数据/测试或显式N/A
- 本版本页面字段、状态、动作、导航和后台运营规格不存在TBD/RELEASE_BOUND
- 全部依赖版本为GREEN或按发布计划允许的并行依赖已记录
- 冻结契约发生变化时已创建CR并重新生成追踪和SHA
exit_gate:
- 领域代码与前端真实闭环
- 数据库迁移和不变量测试通过
- 契约/单元/集成/E2E/安全专项测试通过
- 日志指标链路和业务告警可验证
- Session Log、追踪矩阵、产物Manifest和下一任务更新
- Staging APK可安装且SHA256、Commit、版本信息完整
change_policy: V1.2.2 页面、字段、状态、动作、API、配置和数据目录是唯一事实源；破坏性变更必须CR+版本升级+迁移+消费者兼容窗口
documentation_baseline: V1.2.2
document_gap_status: ZERO_BLOCKING_DOCUMENT_GAPS
definition_of_ready: releases/R19/DEFINITION_OF_READY.yaml
story_backlog: releases/R19/STORIES.yaml
continuity:
  policy: .continuity/CONTINUITY_POLICY.yaml
  protocol_version: '1.0'
  mode: ENFORCED
  session_required_before_change: true
  checkpoint_required_before_commit: true
  old_conversation_required: false
  handoff_bundle_required_for_actor_switch: true
