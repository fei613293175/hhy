release: R17
title: 支付抽象与H5统一收银台
status: GREEN_COMPLETE
milestone: M2_COMMERCE
depends_on:
- R03
- R16
scope: 彩虹易支付预留、支付WebView、回调验签、查单、对账和异常账务
android_test_apk_required: true
requirements:
- REQ-PAY-001
- REQ-PAY-002
- REQ-LEDGER-001
ui:
  android: []
  h5:
  - H5-008
  - H5-009
  admin:
  - ADM-PAY-001
  - ADM-RECON-001
contracts:
  client_api:
  - GET /api/v1/orders/{orderNo}/cashier
  - POST /api/v1/orders/{orderNo}/payments
  - GET /api/v1/orders/{orderNo}/payment-status
  - POST /public-api/v1/payment/{gateway}/notify
  admin_api:
  - GET /admin-api/v1/payments
  - GET /admin-api/v1/payment-callbacks
  - POST /admin-api/v1/payments/{id}/query
  - GET /admin-api/v1/payment-exceptions
  - POST /admin-api/v1/payment-exceptions/{id}/resolve
  - POST /admin-api/v1/payment-reconciliation/run
  websocket: []
database_tables:
- orders
- payment_transactions
- payment_callbacks
- payment_exception_orders
- payment_reconciliation_records
- accounting_transactions
- accounting_entries
- reward_accounts
- reward_ledger
- reward_settlements
- reward_freezes
- payout_accounts
- withdrawal_requests
- payout_transactions
- payout_callbacks
- payout_reconciliation_records
tests:
- TST-PAY_001-CONCURRENCY
- TST-PAY_001-HAPPY
- TST-PAY_001-IDEMPOTENT
- TST-PAY_001-RECOVERY
- TST-PAY_001-REJECT
- TST-PAY_002-CONCURRENCY
- TST-PAY_002-HAPPY
- TST-PAY_002-IDEMPOTENT
- TST-PAY_002-RECOVERY
- TST-PAY_002-REJECT
entry_gate:
- releases/R17/DEFINITION_OF_READY.yaml 全部适用项为PASS
- releases/R17/STORIES.yaml 中每个故事均绑定页面/API/配置/数据/测试或显式N/A
- 本版本页面字段、状态、动作、导航和后台运营规格不存在TBD/RELEASE_BOUND
- 全部依赖版本为GREEN或按发布计划允许的并行依赖已记录
- 冻结契约发生变化时已创建CR并重新生成追踪和SHA
exit_gate:
- 领域代码与前端真实闭环
- 数据库迁移和不变量测试通过
- 契约/单元/集成/E2E/安全专项测试通过
- 日志指标链路和业务告警可验证
- Session Log、追踪矩阵、产物Manifest和下一任务更新
- Staging APK可安装且SHA256、Commit、版本信息完整
change_policy: V1.2.2 页面、字段、状态、动作、API、配置和数据目录是唯一事实源；破坏性变更必须CR+版本升级+迁移+消费者兼容窗口
documentation_baseline: V1.2.2
document_gap_status: ZERO_BLOCKING_DOCUMENT_GAPS
definition_of_ready: releases/R17/DEFINITION_OF_READY.yaml
story_backlog: releases/R17/STORIES.yaml
continuity:
  policy: .continuity/CONTINUITY_POLICY.yaml
  protocol_version: '1.0'
  mode: ENFORCED
  session_required_before_change: true
  checkpoint_required_before_commit: true
  old_conversation_required: false
  handoff_bundle_required_for_actor_switch: true
